e quem perdeu a hora tomam conta dele quase tanto quanto o espanto com o pr\xF3prio corpo."},"c-mostruario":{room:"quarto-gregor",mission:"meta-m2",titulo:"Mostru\xE1rio de tecidos",texto:"Sobre a mesa, amostras de tecido espalhadas: \xE9 o material de trabalho de um caixeiro-viajante. Gregor vive entre viagens, hor\xE1rios e clientes, e o quarto dele guarda mais coisas do of\xEDcio do que da pr\xF3pria vida."},"c-retrato":{room:"quarto-gregor",mission:"meta-m2",titulo:"O retrato da dama de peles",texto:"Na parede, uma gravura recortada de uma revista e posta numa moldura dourada: uma dama de chap\xE9u e estola de pele, de aspecto altivo. Foi o pr\xF3prio Gregor quem a emoldurou. O quarto \xE9 um dos poucos lugares em que ele expressa um gosto pessoal."},"c-janela":{room:"quarto-gregor",mission:"meta-m2",titulo:"A janela com chuva",texto:"Pela janela se v\xEA um dia cinzento; a chuva bate no parapeito. O tempo encoberto combina com o humor pesado da cena e com a sensa\xE7\xE3o de que n\xE3o h\xE1 sa\xEDda."},"c-chave":{room:"quarto-gregor",mission:"meta-m2",titulo:"A chave na porta",texto:"A porta est\xE1 trancada por dentro. Gregor tem o h\xE1bito de trancar todas as portas \xE0 noite, at\xE9 em casa, uma precau\xE7\xE3o que adquiriu nas viagens. O gesto simples j\xE1 indica dist\xE2ncia dos outros, mesmo dos que vivem sob o mesmo teto."},"c-cama":{room:"quarto-gregor",mission:"meta-m2",titulo:"A cama desfeita",texto:'Gregor est\xE1 deitado de costas, com uma carapa\xE7a dura, e mal consegue se virar. O quarto \xE9 "de gente", mas o corpo j\xE1 n\xE3o cabe nele: o espa\xE7o humano e a nova forma n\xE3o combinam.'},"c-macas":{room:"sala-jantar",mission:"meta-m3",titulo:"A fruteira de ma\xE7\xE3s",texto:"Numa travessa, ma\xE7\xE3s. Numa cena de f\xFAria, o pai atira ma\xE7\xE3s em Gregor, e uma delas fica cravada em suas costas. A ferida inflama e quase ningu\xE9m na casa se preocupa em trat\xE1-la."},"c-uniforme":{room:"sala-jantar",mission:"meta-m3",titulo:"O uniforme azul",texto:"Sobre a cadeira, um uniforme azul de bot\xF5es dourados: o pai trabalha agora como cont\xEDnuo de banco. Ele chega a cochilar com o uniforme, como se n\xE3o pudesse largar o novo papel. O homem que antes vivia em casa passa a ter de provar valor."},"c-jornal":{room:"sala-jantar",mission:"meta-m3",titulo:"O jornal do pai",texto:"O pai gosta de ler o jornal \xE0 mesa por horas. O mesmo jornal serve de arma quando ele tenta empurrar Gregor de volta para o quarto. O objeto comum muda de sentido conforme o clima da casa."},"c-violino":{room:"quarto-grete",mission:"meta-m3",titulo:"O violino de Grete",texto:"Um violino repousa na caixa. Grete toca bem, e Gregor planejava mand\xE1-la ao conservat\xF3rio, uma surpresa que pretendia anunciar no Natal. O instrumento guarda um sonho de Gregor para a irm\xE3."},"c-anotacoes":{room:"quarto-grete",mission:"meta-m3",titulo:"As anota\xE7\xF5es de Grete",texto:'Uma folha com anota\xE7\xF5es: "leite com p\xE3o: n\xE3o tocou. Legumes velhos, queijo duro, restos de comida: comeu." Grete tenta descobrir do que Gregor gosta agora, e percebe que o gosto dele j\xE1 n\xE3o \xE9 o de antes.'},"c-estudos":{room:"quarto-grete",mission:"meta-m3",titulo:"Os livros de estudo",texto:"Cadernos de estenografia e de franc\xEAs. Depois da transforma\xE7\xE3o, Grete trabalha como vendedora e estuda \xE0 noite. A irm\xE3 que antes s\xF3 tocava violino \xE9 obrigada a amadurecer r\xE1pido."},"c-inquilinos":{room:"sala-estar",mission:"meta-m4",titulo:"Os tr\xEAs inquilinos",texto:"Tr\xEAs cavalheiros barbudos alugam um quarto da casa. Eles exigem ordem e limpeza, e a fam\xEDlia passa a esconder a verdade sobre Gregor e a mudar os pr\xF3prios h\xE1bitos para agrad\xE1-los."},"c-musica":{room:"sala-estar",mission:"meta-m4",titulo:"A m\xFAsica que atrai Gregor",texto:"Quando Grete toca violino na sala, Gregor sai do quarto, atra\xEDdo pelo som. Ele se pergunta se pode ser um animal, j\xE1 que a m\xFAsica o comove tanto. O trecho sugere que a sensibilidade humana permanece, apesar do corpo."},"c-porta-aberta":{room:"sala-estar",mission:"meta-m4",titulo:"A porta entreaberta",texto:'Nas noites em que a fam\xEDlia re\xFAne-se na sala, a porta do quarto de Gregor fica aberta. Ele observa do escuro, ouvindo, sem poder participar. A porta marca a fronteira entre o "dentro" e o "fora" da vida familiar.'},"c-poltrona":{room:"sala-estar",mission:"meta-m4",titulo:"A poltrona vazia",texto:"Uma poltrona vazia perto da mesa. Antes, Gregor sentava ali \xE0 noite, escutando a fam\xEDlia ou lendo o jornal. A aus\xEAncia do lugar dele mostra como a casa se reorganiza sem Gregor ao centro."}},vi=Object.keys(Ot);var Lt={arquivista:{first:[{who:"Arquivista",text:"Bem-vindo ao Arquivo da Metamorfose! Este apartamento guarda a lembran\xE7a de uma manh\xE3 em que tudo mudou para a fam\xEDlia Samsa."},{who:"Arquivista",text:"Quem vive aqui s\xE3o ecos: lembran\xE7as da hist\xF3ria que ainda conversam. Escute com aten\xE7\xE3o, porque cada um conhece s\xF3 um peda\xE7o da verdade."},{who:"Arquivista",text:"O Sal\xE3o do Grande Enigma s\xF3 abre com quatro Fragmentos da Chave. Cada fragmento est\xE1 guardado por uma miss\xE3o. Comece pelo Livro desta antessala."},{who:"Arquivista",text:"Em cada miss\xE3o voc\xEA tem tr\xEAs cora\xE7\xF5es. Se errar, eu ajudo com dicas e explico o racioc\xEDnio. Se os cora\xE7\xF5es acabarem, voc\xEA revisa o conte\xFAdo e tenta de novo, sem perder o que j\xE1 fez."}],again:[{who:"Arquivista",text:"Ler \xE9 investigar. Examine objetos, compare o que cada eco diz e confirme nas pistas do seu Caderno."},{who:"Arquivista",text:"Se travar numa pergunta, pe\xE7a uma dica: ela n\xE3o custa cora\xE7\xE3o, apenas muda a recompensa."}],m1done:[{who:"Arquivista",text:"O primeiro fragmento j\xE1 est\xE1 com voc\xEA. A porta do quarto de Gregor, no Corredor das Portas, se abriu. Mas lembre: a porta estava trancada por dentro..."}],allDone:[{who:"Arquivista",text:"Voc\xEA reuniu a Chave inteira! O Sal\xE3o do Grande Enigma o espera. Que as suas interpreta\xE7\xF5es sejam bem fundamentadas no texto."}]},gerente:[{who:"Gerente (eco)",text:"Sou o gerente da firma. Vim at\xE9 aqui porque Gregor n\xE3o apareceu na esta\xE7\xE3o. Em cinco anos de casa, ele nunca faltou."},{who:"Gerente (eco)",text:"O patr\xE3o chegou a insinuar uma suspeita sobre uns recebimentos entregues a ele. Eu duvidei e quis ouvir o rapaz pessoalmente."},{who:"Gerente (eco)",text:"Pela porta, a voz dele estava estranha, e a resposta, confusa. Fiquei preocupado... e assustado. Tudo o que importava era o trem e o trabalho!"},{who:"Arquivista",text:"Perceba como o gerente fala s\xF3 de hor\xE1rios e deveres. Para ele, Gregor \xE9, antes de tudo, um funcion\xE1rio."}],pai:[{who:"Pai (eco)",text:"Meu neg\xF3cio faliu h\xE1 alguns anos, e foi Gregor quem passou a sustentar a casa. Fiquei acomodado por tempo demais."},{who:"Pai (eco)",text:"Hoje trabalho como cont\xEDnuo de banco. Visto este uniforme azul de bot\xF5es dourados e confesso que nem o tiro para cochilar."},{who:"Pai (eco)",text:"Naquele dia, a raiva me dominou. Tinha uma travessa de ma\xE7\xE3s ao alcance... e atirei. N\xE3o gosto de lembrar do que fiz."}],mae:[{who:"M\xE3e (eco)",text:"Tenho problemas de respira\xE7\xE3o, e a cena com o meu filho me fez perder os sentidos. Quero v\xEA-lo, mas Grete e meu marido me seguram."},{who:"M\xE3e (eco)",text:"Agora costuro roupas \xEDntimas para uma loja de moda. Cada ponto \xE9 uma forma de ajudar a casa."},{who:"M\xE3e (eco)",text:"Gregor sempre foi atencioso comigo. \xC9 duro ver que a vida que t\xEDnhamos acabou de repente."}],grete:[{who:"Grete (eco)",text:"Eu toco violino. Gregor queria me mandar ao conservat\xF3rio; ele pretendia contar no Natal. Isso me comove at\xE9 hoje."},{who:"Grete (eco)",text:"No come\xE7o fui eu quem cuidou dele: levava comida e testava o que ele aceitava, anotando tudo. Depois comecei a trabalhar numa loja e a estudar \xE0 noite, e a paci\xEAncia foi acabando."},{who:"Grete (eco)",text:"Sei que mudei. Quando aquilo tudo se acumulou, eu falei que precis\xE1vamos nos livrar dele. Ainda penso nessa frase."}],faxineira:[{who:"Faxineira (eco)",text:'Eu sou a faxineira que a fam\xEDlia contratou. N\xE3o tenho medo do "velho besouro", como o chamo. J\xE1 vi coisa pior na vida.'},{who:"Faxineira (eco)",text:"Foi comigo que a casa descobriu o fim: encontrei Gregor sem vida pela manh\xE3 e dei o aviso. A fam\xEDlia respirou aliviada, e ali ficou claro como o tempo tinha mudado as coisas."}],porta_trancada:{quarto:"A porta do quarto de Gregor est\xE1 trancada por dentro. O primeiro Fragmento da Chave (Miss\xE3o 1, no Livro da Antessala) a abrir\xE1.",jantar:'Esta porta est\xE1 selada. Termine a miss\xE3o "Pistas do Quarto" para abri-la.',grete:'Esta porta est\xE1 selada. Termine a miss\xE3o "Pistas do Quarto" para abri-la.',estar:'Esta porta est\xE1 selada. Termine a miss\xE3o "A Fam\xEDlia e o Conflito" para abri-la.',salao:"Esta porta tem quatro fechaduras. Re\xFAna os quatro Fragmentos da Chave para abri-la."},pedestal_bloqueado:"O Livro est\xE1 escurecido. Examine mais pistas neste c\xF4modo para entender o contexto antes de responder."};var Hs={id:"meta-m1",world:"metamorfose",n:1,titulo:"O Despertar",resumo:"Uma manh\xE3 chuvosa, um despertador atrasado e um corpo que j\xE1 n\xE3o \xE9 o mesmo.",local:"antessala",contexto:["Numa manh\xE3 de chuva, Gregor Samsa, caixeiro-viajante de uma firma de tecidos, acorda na pr\xF3pria cama e percebe que o corpo mudou: ele virou um inseto monstruoso.","O que mais intriga, por\xE9m, \xE9 o que passa pela cabe\xE7a dele: o despertador, o trem perdido, o chefe, a firma. A estranheza do fato \xE9 contada com uma calma que contrasta com o absurdo da situa\xE7\xE3o.","Logo a fam\xEDlia chama \xE0 porta e, em seguida, chega algu\xE9m da firma para saber por que Gregor faltou. Observe como cada personagem reage."],objetivo:"Entender quem \xE9 Gregor, o que mudou nele e como ele reage \xE0 transforma\xE7\xE3o.",instrucoes:"Leia o contexto e responda com base no que voc\xEA leu do livro. Cada resposta errada custa um cora\xE7\xE3o, mas vem com uma explica\xE7\xE3o. Dicas n\xE3o custam cora\xE7\xE3o; s\xF3 reduzem um pouco a recompensa.",explorar:[],minClues:0,criterio:"Responder corretamente a todas as perguntas da miss\xE3o.",fechamento:"Voc\xEA entendeu a situa\xE7\xE3o inicial: o fato extraordin\xE1rio vem contado em tom normal, e Gregor se preocupa mais com o trabalho do que com o pr\xF3prio corpo. Essa estranheza \xE9 a chave da hist\xF3ria.",reward:{xp:40,coins:10,fragment:"frag-1"},requires:[],questions:[{id:"m1-q1",type:"single",skill:"explicit",prompt:"Logo no in\xEDcio da narrativa, o que acontece com Gregor Samsa?",options:[{text:"Ele sonha que virou um inseto, mas acorda normal e segue para o trabalho.",feedback:"N\xE3o \xE9 sonho: dentro da hist\xF3ria, o corpo de Gregor realmente mudou, e os outros personagens tamb\xE9m o veem assim."},{text:"Ele \xE9 enfeiti\xE7ado por um colega da firma e passa a viver escondido.",feedback:"A narrativa n\xE3o aponta nenhum respons\xE1vel nem explica a causa da transforma\xE7\xE3o. Essa falta de explica\xE7\xE3o \xE9 uma escolha do autor."},{text:"Ele acorda na pr\xF3pria cama transformado em um inseto monstruoso."},{text:"Ele adoece e passa a ter alucina\xE7\xF5es com insetos.",feedback:"N\xE3o se trata de alucina\xE7\xE3o: o corpo de Gregor \xE9 outro, e quem o v\xEA tamb\xE9m percebe isso."}],correct:2,hints:["Pense na primeira cena: onde Gregor est\xE1 e o que ele percebe sobre o pr\xF3prio corpo?","Dentro da hist\xF3ria, a transforma\xE7\xE3o \xE9 real: outras pessoas tamb\xE9m veem Gregor assim."],explanation:"A novela come\xE7a com a transforma\xE7\xE3o j\xE1 consumada: Gregor acorda convertido em um inseto monstruoso. O narrador n\xE3o explica a causa, e esse sil\xEAncio produz o estranhamento que acompanha toda a leitura."},{id:"m1-q2",type:"multi",skill:"explicit",prompt:"Marque tudo o que a narrativa mostra sobre o trabalho e a vida de Gregor.",options:[{text:"Ele \xE9 caixeiro-viajante: viaja vendendo tecidos a partir de amostras."},{text:"Ele gosta tanto do emprego que sonha em ficar na firma para sempre."},{text:"Ele sustenta os pais e a irm\xE3 e carrega uma d\xEDvida da fam\xEDlia com o chefe."},{text:"Ele trabalha em casa, num escrit\xF3rio montado no apartamento."},{text:"Ele reclama do trabalho: viagens cansativas, hor\xE1rios r\xEDgidos e rela\xE7\xF5es superficiais."}],correct:[0,2,4],feedbackWrong:"Releia: Gregor sustenta a fam\xEDlia e acha o trabalho pesado. Ele continua na firma sobretudo por causa da d\xEDvida dos pais com o chefe e da responsabilidade com a casa.",hints:["Pense no que Gregor pensa sobre a firma e sobre as viagens.","S\xE3o tr\xEAs afirma\xE7\xF5es verdadeiras: uma fala da profiss\xE3o, outra da d\xEDvida e do sustento, outra da reclama\xE7\xE3o."],explanation:"Gregor vive para o trabalho: viaja, cumpre hor\xE1rios e sustenta a casa desde que o neg\xF3cio do pai fracassou. Ele reclama da rotina, mas se sente preso \xE0 d\xEDvida da fam\xEDlia com o patr\xE3o."},{id:"m1-q3",type:"single",skill:"inference",prompt:"O despertador mostra que Gregor perdeu a hora. Qual \xE9 a principal preocupa\xE7\xE3o dele nesse momento?",options:[{text:"Procurar um m\xE9dico para tratar o novo corpo.",feedback:"Nesta passagem, o que domina os pensamentos dele n\xE3o \xE9 o tratamento, mas o trem perdido e o emprego."},{text:"Chegar ao trabalho e evitar problemas com o chefe."},{text:"Encontrar um jeito de impedir que a fam\xEDlia o veja.",feedback:"Mais tarde ele se esconde da fam\xEDlia, mas, neste momento, o que o aflige \xE9 o atraso e a firma."},{text:"Descobrir quem mexeu no despertador.",feedback:"Ningu\xE9m mexeu no despertador. O problema \xE9 o atraso de Gregor."}],correct:1,hints:["Observe o que ele pensa logo depois de olhar o despertador.","Ele pensa na firma, no trem e no que o chefe poderia achar."],explanation:"A rea\xE7\xE3o surpreende: em vez de se concentrar no estado do corpo, Gregor se afoga em preocupa\xE7\xF5es de trabalho. Isso mostra o quanto a rotina e a obriga\xE7\xE3o dominam a vida dele."},{id:"m1-q4",type:"order",skill:"sequence",prompt:"Coloque na ordem em que acontecem os fatos da manh\xE3 em que Gregor acorda transformado.",items:["O pai o empurra de volta para dentro do quarto, e a porta \xE9 fechada.","Gregor acorda transformado e olha o quarto e o despertador.","O gerente da firma chega \xE0 casa para saber por que ele faltou.","A m\xE3e chama \xE0 porta, e Gregor percebe que a pr\xF3pria voz j\xE1 n\xE3o \xE9 a mesma.","Gregor consegue abrir a porta e se mostra ao gerente."],correct:[1,3,2,4,0],hints:["Comece pelo primeiro momento da manh\xE3: o que Gregor v\xEA ao acordar?","A fam\xEDlia chama antes de algu\xE9m de fora chegar; a abertura da porta vem depois da chegada do gerente."],explanation:"A cena aumenta a tens\xE3o: da descoberta \xEDntima (o corpo e o despertador) passa-se \xE0 press\xE3o da fam\xEDlia, depois \xE0 press\xE3o do trabalho (o gerente) e termina com a exposi\xE7\xE3o de Gregor e a viol\xEAncia do pai."},{id:"m1-q5",type:"single",skill:"interpretation",prompt:"Por que \xE9 importante, para entender a hist\xF3ria, que Gregor se preocupe mais com o trem do que com o pr\xF3prio corpo?",options:[{text:"Porque mostra que Gregor gosta de ser um inseto.",feedback:"Nada no texto sugere desejo pela transforma\xE7\xE3o; ele tenta, aflito, lidar com ela."},{text:"Porque prova que ele n\xE3o percebeu a mudan\xE7a no corpo.",feedback:"Ele percebe: tenta se virar na cama e estranha o corpo e a voz."},{text:"Porque mostra que ele n\xE3o se importa com a fam\xEDlia.",feedback:"Ao contr\xE1rio: ele pensa nos pais e na d\xEDvida e quer continuar sustentando a casa."},{text:"Porque revela como o trabalho e o dever dominam a vida dele, a ponto de ofuscar o espanto com o pr\xF3prio corpo."}],correct:3,hints:["O que \xE9 mais urgente para Gregor: o corpo ou o emprego?","A hist\xF3ria aproxima a transforma\xE7\xE3o do corpo ao peso da rotina de trabalho."],explanation:"A rea\xE7\xE3o de Gregor sugere uma vida em que o trabalho vem antes de tudo, uma das chaves para ler a novela como cr\xEDtica a uma rotina que consome as pessoas."},{id:"m1-q6",type:"reflect",prompt:"Pense em como Gregor reage. Se o seu corpo mudasse da noite para o dia, qual seria a sua primeira preocupa\xE7\xE3o? Por qu\xEA?"}],review:{passage:"Gregor Samsa \xE9 caixeiro-viajante e sustenta a fam\xEDlia. Numa manh\xE3 chuvosa, acorda transformado em um inseto monstruoso, mas a primeira coisa que o inquieta \xE9 ter perdido a hora do trem. Logo a m\xE3e chama \xE0 porta e, depois, chega o gerente da firma, preocupado com a aus\xEAncia de Gregor.",questions:[{id:"m1-r1",type:"single",prompt:"Qual \xE9 a profiss\xE3o de Gregor?",options:[{text:"Caixeiro-viajante, vendedor de tecidos."},{text:"Professor de m\xFAsica."},{text:"Banc\xE1rio."},{text:"M\xE9dico."}],correct:0,explanation:"Gregor \xE9 caixeiro-viajante: vende tecidos para uma firma, a partir de amostras."},{id:"m1-r2",type:"single",prompt:"Quem vai \xE0 casa de Gregor, preocupado com a falta dele ao trabalho?",options:[{text:"A faxineira."},{text:"O gerente da firma."},{text:"Um dos inquilinos."},{text:"O m\xE9dico da fam\xEDlia."}],correct:1,explanation:"O gerente da firma vai at\xE9 a casa porque Gregor, sempre pontual, n\xE3o apareceu."},{id:"m1-r3",type:"single",prompt:"A narrativa explica por que Gregor se transformou?",options:[{text:"Sim, foi um feiti\xE7o."},{text:"Sim, foi uma doen\xE7a rara."},{text:"N\xE3o: a causa nunca \xE9 explicada."},{text:"Sim, foi um castigo do chefe."}],correct:2,explanation:"A causa da transforma\xE7\xE3o nunca \xE9 explicada: o texto parte do fato consumado."}]}},Fs={id:"meta-m2",world:"metamorfose",n:2,titulo:"Pistas do Quarto",resumo:"Cada objeto do quarto guarda um ind\xEDcio sobre a vida que Gregor levava.",local:"quarto-gregor",contexto:["O quarto de Gregor \xE9 um quarto comum de gente, mas agora ele est\xE1 ali dentro com um corpo que n\xE3o cabe nesse mundo. Cada objeto guarda um ind\xEDcio sobre quem Gregor era antes e sobre o que ele perdeu.","Sua tarefa: examine os objetos que brilham no quarto. As pistas ficam registradas no Caderno. Examine pelo menos quatro antes de abrir o Livro."],objetivo:"Interpretar objetos e ambientes como pistas sobre o personagem e sobre o sentido da hist\xF3ria.",instrucoes:"Ande pelo quarto, aproxime-se dos objetos que brilham e aperte E (ou o bot\xE3o A\xE7\xE3o). Depois volte ao Livro e responda.",explorar:["c-despertador","c-mostruario","c-retrato","c-janela","c-chave","c-cama"],minClues:4,criterio:"Examinar ao menos quatro pistas do quarto e responder corretamente a todas as perguntas.",fechamento:"Objetos contam hist\xF3rias: o mostru\xE1rio fala de trabalho, a gravura emoldurada de desejo, a chave trancada de dist\xE2ncia. O quarto \xE9 um retrato da vida de Gregor.",reward:{xp:60,coins:12,fragment:"frag-2"},requires:["meta-m1"],questions:[{id:"m2-q1",type:"single",skill:"inference",prompt:"O mostru\xE1rio de tecidos espalhado sobre a mesa indica que...",options:[{text:"Gregor pretende abrir uma loja de tecidos pr\xF3pria.",feedback:"O texto n\xE3o indica esse plano. O mostru\xE1rio \xE9 instrumento de trabalho de um empregado, n\xE3o de um futuro empres\xE1rio."},{text:"Gregor tem um passatempo art\xEDstico.",feedback:"As amostras servem \xE0s vendas, n\xE3o a um passatempo."},{text:"o trabalho ocupa at\xE9 o ambiente mais \xEDntimo de Gregor, e a vida dele gira em torno das viagens e das vendas."},{text:"a fam\xEDlia inteira trabalha com tecidos.",feedback:"Quem trabalha com tecidos, no texto, \xE9 Gregor, para uma firma. A fam\xEDlia depende do sal\xE1rio dele."}],correct:2,hints:["Que profiss\xE3o usa amostras para mostrar produtos aos clientes?","Pense no quarto como espelho da vida: o que ele diz sobre a rotina de Gregor?"],explanation:"O mostru\xE1rio mostra que o trabalho de caixeiro-viajante invade o espa\xE7o \xEDntimo do personagem. O quarto, que deveria ser lugar de descanso e de vida pessoal, tamb\xE9m leva a marca da profiss\xE3o."},{id:"m2-q2",type:"single",skill:"symbol",prompt:"Gregor recortou de uma revista a gravura de uma dama coberta de peles e a colocou numa moldura dourada. O que esse detalhe sugere?",options:[{text:"Que a dama \xE9 parente de Gregor.",feedback:"A dama \xE9 uma imagem de revista, sem rela\xE7\xE3o de parentesco com ele."},{text:"Um gosto e um cuidado pessoais: \xE9 um dos poucos sinais de vida pr\xF3pria numa rotina dominada pelo trabalho."},{text:"Que Gregor pretende vender o quadro.",feedback:"Nada indica valor comercial: \xE9 uma lembran\xE7a pessoal."},{text:"Que a gravura foi um presente de um cliente.",feedback:"O texto diz que foi o pr\xF3prio Gregor quem a recortou e emoldurou."}],correct:1,hints:["Quem recortou e emoldurou a imagem?","Num quarto cheio de sinais de trabalho, o que a moldura dourada revela?"],explanation:"Gregor recortou a imagem e a emoldurou. Num quarto cheio de objetos de trabalho, o gesto revela desejo, gosto e afeto: um canto de vida pessoal. Mais adiante, quando querem tirar os m\xF3veis do quarto, ele se agarra ao quadro para proteg\xEA-lo."},{id:"m2-q3",type:"single",skill:"inference",prompt:"Por h\xE1bito, adquirido nas viagens, Gregor tranca todas as portas \xE0 noite, at\xE9 em casa. Que ideia esse detalhe refor\xE7a?",options:[{text:"Que a fam\xEDlia o pro\xEDbe de sair do quarto.",feedback:"No come\xE7o, a tranca \xE9 escolha e h\xE1bito dele. A ideia de confinamento aparece mais tarde, quando \xE9 a fam\xEDlia que o mant\xE9m fechado."},{text:"Que h\xE1 ladr\xF5es no pr\xE9dio.",feedback:"O texto fala de um h\xE1bito vindo das viagens, e n\xE3o de uma amea\xE7a externa."},{text:"Que o quarto foi constru\xEDdo como uma pris\xE3o.",feedback:"O quarto \xE9 um quarto comum. A ideia de pris\xE3o surge s\xF3 depois, pela atitude da fam\xEDlia."},{text:"Que, mesmo em casa, Gregor vive em guarda e \xE0 dist\xE2ncia dos outros."}],correct:3,hints:["De onde veio o h\xE1bito de trancar as portas?","Pense no que esse h\xE1bito diz sobre a rela\xE7\xE3o dele com as pessoas que moram na mesma casa."],explanation:"A chave trancada por dentro mostra algu\xE9m acostumado a viver em alerta, mesmo em casa: um tra\xE7o de solid\xE3o e de dist\xE2ncia. Mais tarde a porta mudar\xE1 de fun\xE7\xE3o: ser\xE1 a fam\xEDlia que o manter\xE1 preso."},{id:"m2-q4",type:"single",skill:"interpretation",prompt:"A chuva batendo na janela e o dia cinzento ajudam a criar qual clima na cena?",options:[{text:"Melancolia e peso, em sintonia com o estado de esp\xEDrito de Gregor."},{text:"Alegria de um dia de festa.",feedback:"Chuva e c\xE9u cinzento sugerem o contr\xE1rio: peso, tristeza, des\xE2nimo."},{text:"Aventura e descoberta.",feedback:"A cena \xE9 de ang\xFAstia e de confinamento, n\xE3o de aventura."},{text:"A calma de um domingo de descanso.",feedback:"Gregor est\xE1 aflito e atrasado; o clima \xE9 de tens\xE3o, n\xE3o de descanso."}],correct:0,hints:["Que sensa\xE7\xE3o o tempo cinzento passa: leveza ou peso?","Pense em como o cen\xE1rio pode refletir o estado de esp\xEDrito do personagem."],explanation:"O tempo encoberto refor\xE7a o \xE2nimo pesado de Gregor: o cen\xE1rio comunica sentimento sem que o narrador precise diz\xEA-lo diretamente."},{id:"m2-q5",type:"single",skill:"interpretation",prompt:"O narrador descreve o fato imposs\xEDvel (um homem transformado em inseto) com tom calmo e cheio de detalhes comuns. Que efeito isso produz?",options:[{text:"Faz o leitor rir o tempo todo.",feedback:"Pode haver ironia, mas a cena n\xE3o \xE9 s\xF3 piada: o ambiente \xE9 opressivo e inquietante."},{text:"Explica cientificamente a transforma\xE7\xE3o.",feedback:"A causa nunca \xE9 explicada; o narrador s\xF3 descreve o que acontece."},{text:"Estranhamento: o absurdo parece normal, e \xE9 isso que inquieta o leitor."},{text:"Provoca medo expl\xEDcito, com gritos e descri\xE7\xF5es de terror.",feedback:"O tom \xE9 contido e quase burocr\xE1tico; o desconforto vem do contraste, n\xE3o de cenas de terror."}],correct:2,hints:["Compare: o fato \xE9 absurdo, mas o tom do narrador \xE9...?","Repare como Gregor pensa em hor\xE1rios e obriga\xE7\xF5es (coisas comuns) logo depois de virar inseto."],explanation:"O contraste entre o fato extraordin\xE1rio e o tom cotidiano cria estranhamento, uma das marcas da escrita de Kafka, tanto que o adjetivo \u201Ckafkiano\u201D passou a descrever situa\xE7\xF5es absurdas e opressivas."},{id:"m2-q6",type:"reflect",prompt:"Escolha um objeto do seu quarto (ou da sua mochila) que contaria algo importante sobre voc\xEA. O que ele revelaria?"}],review:{passage:"O quarto de Gregor mostra a vida que ele levava: o despertador e o mostru\xE1rio de tecidos falam de trabalho; a gravura da dama de peles \xE9 um dos poucos gostos pessoais dele; a chave na porta mostra o h\xE1bito de se trancar. A chuva d\xE1 ao dia um ar pesado e melanc\xF3lico.",questions:[{id:"m2-r1",type:"single",prompt:"Que objeto revela o trabalho de caixeiro-viajante de Gregor?",options:[{text:"O violino."},{text:"O mostru\xE1rio de tecidos."},{text:"A fruteira de ma\xE7\xE3s."},{text:"O uniforme azul."}],correct:1,explanation:"O mostru\xE1rio de tecidos \xE9 a ferramenta de trabalho do caixeiro-viajante."},{id:"m2-r2",type:"single",prompt:"Quem emoldurou a gravura da dama de peles?",options:[{text:"O pai."},{text:"Grete."},{text:"O pr\xF3prio Gregor."},{text:"A faxineira."}],correct:2,explanation:"Foi o pr\xF3prio Gregor que recortou a imagem e a emoldurou, um gesto de gosto pessoal."},{id:"m2-r3",type:"single",prompt:"Que clima a chuva ajuda a criar na cena?",options:[{text:"Festivo."},{text:"Melanc\xF3lico."},{text:"C\xF4mico."},{text:"Heroico."}],correct:1,explanation:"A chuva e o c\xE9u cinzento refor\xE7am um clima melanc\xF3lico, pesado."}]}};var Ws={id:"meta-m3",world:"metamorfose",n:3,titulo:"A Fam\xEDlia e o Conflito",resumo:"Dinheiro, cansa\xE7o e medo mudam o papel de cada pessoa dentro da casa dos Samsa.",local:"sala-jantar",contexto:["Dentro de casa, a transforma\xE7\xE3o de Gregor muda o papel de todos. O pai, que vivia acomodado, volta a trabalhar; a m\xE3e costura para fora; Grete, a irm\xE3 mais nova, passa a cuidar de Gregor e depois tamb\xE9m trabalha.","Examine pelo menos quatro pistas na Sala de Jantar e no Quarto de Grete, converse com os ecos da fam\xEDlia e s\xF3 ent\xE3o abra o Livro. Observe como o carinho convive com o medo e o cansa\xE7o."],objetivo:"Analisar o comportamento de cada familiar e entender como dinheiro, cansa\xE7o e medo transformam as rela\xE7\xF5es.",instrucoes:"Explore a Sala de Jantar e o Quarto de Grete, converse com o Pai, a M\xE3e e Grete e examine as pistas. Depois responda no Livro da Sala de Jantar.",explorar:["c-macas","c-uniforme","c-jornal","c-violino","c-anotacoes","c-estudos"],minClues:4,criterio:"Examinar ao menos quatro pistas e responder corretamente a todas as perguntas.",fechamento:"Ningu\xE9m na fam\xEDlia \xE9 s\xF3 v\xEDtima ou s\xF3 culpado: o cuidado de Grete, a fragilidade da m\xE3e e a f\xFAria do pai nascem da mesma press\xE3o. Entender isso \xE9 ler com mais profundidade.",reward:{xp:70,coins:15,fragment:"frag-3"},requires:["meta-m2"],questions:[{id:"m3-q1",type:"single",skill:"character",prompt:"O que muda no comportamento do pai depois da transforma\xE7\xE3o de Gregor?",options:[{text:"Ele deixa de trabalhar para cuidar do filho.",feedback:"\xC9 o contr\xE1rio: o pai, que estava acomodado, volta a trabalhar."},{text:"Ele, que estava acomodado, volta a trabalhar (como cont\xEDnuo de banco) e passa a agir com mais dureza em casa."},{text:"Ele passa a viver de uma heran\xE7a deixada por Gregor.",feedback:"Gregor n\xE3o deixa heran\xE7a: a fam\xEDlia precisa buscar renda."},{text:"Ele se muda para outra cidade.",feedback:"O pai continua morando na casa da fam\xEDlia."}],correct:1,hints:["Pense: quem sustentava a casa antes da transforma\xE7\xE3o, e o que acontece quando Gregor deixa de ganhar dinheiro?","Olhe para o uniforme azul de bot\xF5es dourados examinado na Sala de Jantar."],explanation:"Quando Gregor deixa de sustentar a casa, o pai volta a trabalhar. Ao mesmo tempo, a presen\xE7a dele em casa se torna dura e autorit\xE1ria. O uniforme mostra o novo papel que ele assume."},{id:"m3-q2",type:"multi",skill:"character",prompt:"Quais atitudes mostram o cuidado inicial de Grete com Gregor?",options:[{text:"Testar v\xE1rios alimentos para descobrir de que ele gosta agora."},{text:"Convid\xE1-lo a voltar a jantar \xE0 mesa com a fam\xEDlia."},{text:"Sair do quarto enquanto ele come, para que ele se sinta \xE0 vontade."},{text:"Cuidar da limpeza do quarto dele."},{text:"Pedir ajuda aos vizinhos para cuidar dele."}],correct:[0,2,3],feedbackWrong:"Releia as anota\xE7\xF5es de Grete: ela observa o que Gregor aceita, deixa-o comer sozinho e limpa o quarto. Convid\xE1-lo \xE0 mesa ou chamar vizinhos n\xE3o combina com a fam\xEDlia, que esconde o caso.",hints:["Pense nas primeiras semanas: quem leva comida a Gregor e como?","Tr\xEAs a\xE7\xF5es est\xE3o corretas; duas imaginam uma aproxima\xE7\xE3o que o texto n\xE3o mostra."],explanation:"Grete assume o cuidado: observa o que Gregor aceita, deixa-o comer sozinho e limpa o quarto. Mas o cuidado \xE9 feito \xE0 dist\xE2ncia: Gregor segue isolado, longe da mesa e dos olhares de fora."},{id:"m3-q3",type:"single",skill:"inference",prompt:"Grete e a m\xE3e decidem tirar os m\xF3veis do quarto para dar mais espa\xE7o a Gregor. Por que essa cena \xE9 dolorosa para ele?",options:[{text:"Porque ele sente que est\xE1 perdendo as lembran\xE7as e a identidade humana que os m\xF3veis representam."},{text:"Porque ele gostava de dormir no ch\xE3o.",feedback:"N\xE3o h\xE1 essa informa\xE7\xE3o: o problema \xE9 o que os m\xF3veis representam para ele."},{text:"Porque os m\xF3veis eram caros e ele queria vend\xEA-los.",feedback:"Nada indica interesse comercial; o valor dos m\xF3veis para Gregor \xE9 afetivo."},{text:"Porque a m\xE3e e a irm\xE3 brigaram violentamente.",feedback:"A cena n\xE3o \xE9 uma briga: elas agem com boa inten\xE7\xE3o, mas sem perceber o que tiram dele."}],correct:0,hints:["Pense no que os m\xF3veis significam para quem vive naquele quarto desde sempre.","Lembre o que Gregor faz para proteger a gravura da dama de peles."],explanation:"Os m\xF3veis s\xE3o mem\xF3ria e v\xEDnculo com a vida humana. Mesmo com boa inten\xE7\xE3o, retir\xE1-los faz Gregor sentir que est\xE1 sendo apagado. Por isso ele se agarra ao quadro da dama de peles."},{id:"m3-q4",type:"single",skill:"character",prompt:"Por que o pai atira ma\xE7\xE3s em Gregor?",options:[{text:"Porque Gregor tentou agredi-lo.",feedback:"Gregor n\xE3o ataca ningu\xE9m: ele s\xF3 quer voltar ao quarto."},{text:"Porque as ma\xE7\xE3s estavam estragadas e ele queria jog\xE1-las fora.",feedback:"As ma\xE7\xE3s funcionam como proj\xE9teis: o gesto \xE9 violento e atinge o corpo de Gregor."},{text:"Porque, ao ver a m\xE3e desmaiada e Gregor fora do quarto, ele conclui o pior e reage com f\xFAria e medo."},{text:"Porque o gerente da firma mandou.",feedback:"O gerente j\xE1 havia ido embora: a cena acontece dentro de casa, entre a fam\xEDlia."}],correct:2,hints:["Quem acabou de desmaiar, e onde est\xE1 Gregor?","Pense em como o pai interpreta o que v\xEA: ele tem tempo para entender ou reage na hora?"],explanation:"O pai interpreta a situa\xE7\xE3o como uma agress\xE3o de Gregor contra a m\xE3e e responde com viol\xEAncia. A ma\xE7\xE3 que fica cravada nas costas de Gregor vira uma ferida f\xEDsica e simb\xF3lica: marca o ponto em que a rejei\xE7\xE3o se torna viol\xEAncia."},{id:"m3-q5",type:"single",skill:"character",prompt:"Como a m\xE3e se relaciona com Gregor?",options:[{text:"Com total indiferen\xE7a desde o primeiro dia.",feedback:"Ela quer ver o filho e se desespera por ele, ainda que seja impedida."},{text:"Com autoridade, pois \xE9 ela quem comanda a casa.",feedback:"Quem se imp\xF5e \xE9 o pai; a m\xE3e \xE9 fr\xE1gil e sofre de falta de ar."},{text:"Com raiva, por ter sido abandonada por ele.",feedback:"Gregor n\xE3o abandona a m\xE3e: \xE9 o sustento dele que mant\xE9m a casa."},{text:"Com amor e desejo de v\xEA-lo, mas \xE9 fr\xE1gil e acaba contida pelo pai e por Grete."}],correct:3,hints:["Lembre as falas da M\xE3e (eco): o que ela quer em rela\xE7\xE3o a Gregor?","Ela desmaia mais de uma vez; quem a impede de se aproximar?"],explanation:"A m\xE3e ama Gregor e quer v\xEA-lo, mas \xE9 fr\xE1gil e sofre de problemas de respira\xE7\xE3o. Acaba sendo contida pelo pai e por Grete, que a protegem e, ao mesmo tempo, a afastam do filho."},{id:"m3-q6",type:"reflect",prompt:"Pense nos personagens da fam\xEDlia Samsa: quem voc\xEA acha que mais falhou com Gregor? Use uma pista da cena para justificar."}],review:{passage:"Antes da transforma\xE7\xE3o, Gregor sustentava a casa. Depois dela, o pai volta a trabalhar, a m\xE3e costura e Grete cuida do irm\xE3o e arranja um emprego. A conviv\xEAncia se desgasta: a retirada dos m\xF3veis, a f\xFAria do pai e a ma\xE7\xE3 cravada nas costas de Gregor mostram o conflito.",questions:[{id:"m3-r1",type:"single",prompt:"Quem sustentava a casa antes da transforma\xE7\xE3o?",options:[{text:"O pai."},{text:"Grete."},{text:"Gregor."},{text:"A m\xE3e."}],correct:2,explanation:"Depois da fal\xEAncia do neg\xF3cio do pai, Gregor assumiu o sustento da fam\xEDlia."},{id:"m3-r2",type:"single",prompt:"Quem leva comida a Gregor nas primeiras semanas?",options:[{text:"Grete."},{text:"O pai."},{text:"O gerente."},{text:"Um dos inquilinos."}],correct:0,explanation:"Grete \xE9 quem leva comida e tenta descobrir o que o irm\xE3o aceita."},{id:"m3-r3",type:"single",prompt:"O que fica cravado nas costas de Gregor depois da f\xFAria do pai?",options:[{text:"Uma flecha."},{text:"Uma ma\xE7\xE3."},{text:"Uma faca."},{text:"Uma pedra."}],correct:1,explanation:"Uma das ma\xE7\xE3s atiradas pelo pai fica cravada nas costas de Gregor e causa uma ferida duradoura."}]}},Bs={id:"meta-m4",world:"metamorfose",n:4,titulo:"O que est\xE1 por tr\xE1s da hist\xF3ria?",resumo:"A porta, a m\xFAsica e os inquilinos escondem sentidos maiores: trabalho, isolamento e valor das pessoas.",local:"sala-estar",contexto:["A casa muda de rumo: tr\xEAs inquilinos de barba ocupam um quarto, a fam\xEDlia esconde o que pode, e Gregor, cada vez mais isolado, s\xF3 tem a porta entreaberta e a m\xFAsica para sentir que ainda pertence ao mundo.","Examine pelo menos quatro pistas da Sala de Estar e converse com a Faxineira antes de abrir o Livro. Agora a pergunta \xE9 maior: o que a hist\xF3ria quer dizer?"],objetivo:"Interpretar s\xEDmbolos (a porta, a m\xFAsica, o corpo) e ideias gerais (trabalho, aliena\xE7\xE3o, valor das pessoas).",instrucoes:"Explore a Sala de Estar, examine as pistas e converse com a Faxineira. H\xE1 mais de uma leitura poss\xEDvel da hist\xF3ria, mas boas leituras se apoiam em pistas do texto.",explorar:["c-inquilinos","c-musica","c-porta-aberta","c-poltrona"],minClues:3,criterio:"Examinar ao menos tr\xEAs pistas e responder corretamente a todas as perguntas.",fechamento:"Voc\xEA passou do \u201Co que acontece\u201D para o \u201Co que isso significa\u201D. Uma boa interpreta\xE7\xE3o sempre volta ao texto para se justificar.",reward:{xp:80,coins:15,fragment:"frag-4"},requires:["meta-m3"],questions:[{id:"m4-q1",type:"single",skill:"explicit",prompt:"Quem s\xE3o os tr\xEAs inquilinos e por que a fam\xEDlia os recebe?",options:[{text:"Parentes que v\xEAm ajudar a cuidar de Gregor.",feedback:"Eles n\xE3o s\xE3o parentes: pagam pelo quarto como qualquer inquilino."},{text:"Colegas da firma de Gregor, enviados para investig\xE1-lo.",feedback:"Quem vai \xE0 casa por parte da firma \xE9 o gerente, logo no in\xEDcio da hist\xF3ria."},{text:"Homens que alugam um quarto, trazendo renda extra para a casa."},{text:"M\xE9dicos contratados para examinar Gregor.",feedback:"Eles n\xE3o t\xEAm rela\xE7\xE3o com a sa\xFAde de Gregor; s\xE3o h\xF3spedes que pagam pelo quarto."}],correct:2,hints:["Pense nas dificuldades de dinheiro da fam\xEDlia.","Eles pagam para morar num c\xF4modo da casa."],explanation:"A fam\xEDlia aluga um quarto a tr\xEAs inquilinos para aumentar a renda. Para agrad\xE1-los, muda h\xE1bitos e esconde Gregor: o dinheiro e a apar\xEAncia passam a mandar na casa."},{id:"m4-q2",type:"single",skill:"symbol",prompt:"Gregor se aproxima ao ouvir Grete tocar violino e se pergunta se ele \xE9 um animal, j\xE1 que a m\xFAsica o comove tanto. O que essa passagem sugere?",options:[{text:"Que Gregor perdeu qualquer tra\xE7o humano.",feedback:"Ao contr\xE1rio: a emo\xE7\xE3o diante da m\xFAsica \xE9 um tra\xE7o humano, e a pr\xF3pria pergunta mostra isso."},{text:"Que a m\xFAsica tem o poder de reverter a transforma\xE7\xE3o.",feedback:"A transforma\xE7\xE3o n\xE3o \xE9 revertida; a m\xFAsica apenas emociona."},{text:"Que Gregor deseja atrapalhar o recital.",feedback:"Ele se aproxima movido pela emo\xE7\xE3o e pelo desejo de estar perto da irm\xE3."},{text:"Que, apesar do corpo de inseto, ele conserva sensibilidade e desejo de afeto humano."}],correct:3,hints:["O que uma pessoa sente quando a m\xFAsica a comove?","Pense no contraste entre a apar\xEAncia de Gregor e o que ele sente por dentro."],explanation:"A m\xFAsica revela a humanidade que sobrevive no corpo mudado: Gregor sente, deseja e quer se aproximar da irm\xE3. \xC9 o momento em que o contraste entre apar\xEAncia e interior fica mais forte."},{id:"m4-q3",type:"single",skill:"explicit",prompt:"O que acontece quando os inquilinos veem Gregor?",options:[{text:"Ficam curiosos e passam a conversar com ele.",feedback:"Eles reagem com indigna\xE7\xE3o, n\xE3o com curiosidade amistosa."},{text:"Ficam indignados e amea\xE7am deixar a casa sem pagar, e a fam\xEDlia entra em crise."},{text:"Chamam a pol\xEDcia e levam Gregor embora.",feedback:"A pol\xEDcia n\xE3o aparece na hist\xF3ria; a crise acontece dentro da casa."},{text:"Oferecem dinheiro para que a fam\xEDlia o mantenha em casa.",feedback:"Eles querem se afastar da situa\xE7\xE3o, n\xE3o ajud\xE1-la."}],correct:1,hints:["Pense no que algu\xE9m que paga por um quarto faz ao ver uma cena assim.","Eles amea\xE7am mudar de casa e falam em dinheiro."],explanation:"Para os inquilinos, a vis\xE3o de Gregor \xE9 intoler\xE1vel: amea\xE7am romper o contrato e at\xE9 exigir indeniza\xE7\xE3o. Essa press\xE3o externa precipita o conflito final dentro da casa."},{id:"m4-q4",type:"multi",skill:"symbol",prompt:"Marque as leituras da hist\xF3ria que podem ser sustentadas pelo texto.",options:[{text:"A transforma\xE7\xE3o pode simbolizar a aliena\xE7\xE3o de quem vive s\xF3 para o trabalho."},{text:"A hist\xF3ria questiona o valor de uma pessoa medido apenas por sua utilidade para os outros."},{text:"A hist\xF3ria prova que insetos gigantes existem em f\xE1bricas de tecidos."},{text:"O isolamento de Gregor cresce dentro e fora de casa."},{text:"O narrador explica que a transforma\xE7\xE3o foi um castigo merecido."}],correct:[0,1,3],feedbackWrong:"Releia: uma boa leitura simb\xF3lica se apoia em fatos do texto (trabalho, isolamento, utilidade). O narrador nunca explica a causa da transforma\xE7\xE3o nem a apresenta como castigo.",hints:["Descarte primeiro as afirma\xE7\xF5es que o texto n\xE3o pode sustentar (causas \u201Creais\u201D ou castigos explicados).","Tr\xEAs leituras ligam a hist\xF3ria a trabalho, valor de uma pessoa e isolamento."],explanation:"A for\xE7a da novela est\xE1 em permitir leituras que se apoiam no texto: o trabalho que aliena, o valor medido por utilidade e o isolamento crescente. Nenhuma delas exige explicar \u201Ccomo\u201D Gregor virou inseto."},{id:"m4-q5",type:"single",skill:"symbol",prompt:"Ao longo da hist\xF3ria, a porta do quarto ganha um sentido especial. O que ela representa?",options:[{text:"A fronteira entre Gregor e a vida da fam\xEDlia: ora fechada contra ele, ora entreaberta s\xF3 para que ele observe."},{text:"A sa\xEDda que Gregor usa para escapar do trabalho.",feedback:"A porta n\xE3o leva ao trabalho: ela separa Gregor da fam\xEDlia."},{text:"A entrada para um mundo fant\xE1stico.",feedback:"A porta d\xE1 para a sala da pr\xF3pria casa, e \xE9 justamente isso que torna a dist\xE2ncia dolorosa."},{text:"A prova de que a casa tem muitos quartos.",feedback:"O detalhe \xE9 narrativo, n\xE3o decorativo: a porta marca a rela\xE7\xE3o entre Gregor e os outros."}],correct:0,hints:["Pense em quem abre e quem fecha a porta, e em quando isso acontece.","Repare no que Gregor consegue (ou n\xE3o) fazer quando a porta est\xE1 entreaberta."],explanation:"A porta marca a dist\xE2ncia entre Gregor e os outros. Quando a abrem \xE0 noite, ele pode ouvir e ver a fam\xEDlia sem participar. Quando a fecham, o isolamento \xE9 total."},{id:"m4-q6",type:"reflect",prompt:"Em que situa\xE7\xF5es uma pessoa pode ser tratada apenas pelo que produz? O que a hist\xF3ria de Gregor diz sobre isso?"}],review:{passage:"Na terceira parte da hist\xF3ria, a fam\xEDlia aluga um quarto para tr\xEAs inquilinos. Quando Grete toca violino, Gregor sai do quarto, atra\xEDdo pela m\xFAsica. Os inquilinos o veem e amea\xE7am ir embora, e a conviv\xEAncia na casa se rompe.",questions:[{id:"m4-r1",type:"single",prompt:"Quantos inquilinos a fam\xEDlia recebe?",options:[{text:"Um."},{text:"Dois."},{text:"Tr\xEAs."},{text:"Cinco."}],correct:2,explanation:"A fam\xEDlia recebe tr\xEAs inquilinos."},{id:"m4-r2",type:"single",prompt:"Que instrumento Grete toca?",options:[{text:"Violino."},{text:"Piano."},{text:"Flauta."},{text:"Viol\xE3o."}],correct:0,explanation:"Grete toca violino; Gregor pretendia mand\xE1-la estudar m\xFAsica."},{id:"m4-r3",type:"single",prompt:"O que atrai Gregor para fora do quarto na sala?",options:[{text:"O cheiro do jantar."},{text:"A visita do gerente."},{text:"A m\xFAsica de Grete."},{text:"O barulho da rua."}],correct:2,explanation:"A m\xFAsica de Grete o comove e o atrai para fora do quarto."}]}};var Us={id:"meta-m5",world:"metamorfose",n:5,titulo:"O Grande Enigma",resumo:"Juntar fatos, personagens e s\xEDmbolos para interpretar o final e o sentido da novela.",local:"salao",contexto:["Voc\xEA reuniu os quatro fragmentos e abriu o Sal\xE3o do Grande Enigma. Aqui, a hist\xF3ria inteira se junta: da manh\xE3 do despertar ao passeio final da fam\xEDlia.","Cada pergunta pede que voc\xEA ligue pistas de lugares diferentes. Quem desvenda o enigma leva a recompensa do Ba\xFA."],objetivo:"Integrar fatos, personagens e s\xEDmbolos para interpretar o final e o sentido geral da novela.",instrucoes:"Use o Caderno de Pistas: ele guarda tudo o que voc\xEA examinou. Responda no Livro do Sal\xE3o. Ao terminar, o Ba\xFA ser\xE1 aberto.",explorar:[],minClues:0,criterio:"Responder corretamente a todas as perguntas do Grande Enigma.",fechamento:"Enigma resolvido! Voc\xEA percorreu fatos, personagens e s\xEDmbolos e chegou a uma interpreta\xE7\xE3o que se apoia no texto. O Ba\xFA est\xE1 aberto.",reward:{xp:120,coins:30,fragment:null,item:"acc-laurel",medal:"enigma"},requires:["meta-m1","meta-m2","meta-m3","meta-m4"],questions:[{id:"m5-q1",type:"order",skill:"sequence",prompt:"Coloque os grandes momentos da novela na ordem em que acontecem.",items:["A fam\xEDlia aluga um quarto da casa a tr\xEAs inquilinos.","Gregor acorda transformado em inseto.","A faxineira encontra Gregor morto.","O pai atira ma\xE7\xE3s em Gregor, ferindo-o.","O gerente aparece na casa, e Gregor \xE9 empurrado de volta ao quarto.","Grete declara que a fam\xEDlia precisa se livrar de Gregor."],correct:[1,4,3,0,5,2],hints:["Os fatos se dividem em tr\xEAs grandes partes: o despertar, a vida em casa e o desfecho.","A decis\xE3o de Grete acontece depois da cena dos inquilinos, e a descoberta do corpo \xE9 o \xFAltimo dos seis fatos."],explanation:"A novela avan\xE7a do despertar (a transforma\xE7\xE3o e a visita do gerente) para a vida em casa (as ma\xE7\xE3s e os inquilinos) e, por fim, o desfecho (a declara\xE7\xE3o de Grete e a descoberta do corpo)."},{id:"m5-q2",type:"single",skill:"inference",prompt:"Como a fam\xEDlia reage \xE0 morte de Gregor?",options:[{text:"Com luto prolongado, interrompendo o trabalho e a rotina.",feedback:"Depois de um breve momento de recolhimento, a fam\xEDlia sai para passear e faz planos."},{text:"Tentando descobrir a causa da transforma\xE7\xE3o.",feedback:"A causa nunca \xE9 investigada: ningu\xE9m na fam\xEDlia parece buscar uma explica\xE7\xE3o."},{text:"Com al\xEDvio e planos de recome\xE7o: saem para passear e pensam no futuro."},{text:"Com uma cerim\xF4nia p\xFAblica em homenagem a Gregor.",feedback:"N\xE3o h\xE1 cerim\xF4nia p\xFAblica; a fam\xEDlia segue a vida com rapidez."}],correct:2,hints:["Pense no que a fam\xEDlia faz logo depois de a faxineira dar a not\xEDcia.","Observe a atmosfera do passeio: \xE9 de tristeza ou de esperan\xE7a?"],explanation:"A fam\xEDlia sente al\xEDvio e se volta para o futuro. O contraste entre a dor de Gregor e a leveza do final \xE9 um dos momentos mais duros da novela."},{id:"m5-q3",type:"single",skill:"character",prompt:"O que a cena final sugere sobre Grete?",options:[{text:"Que ela guarda m\xE1goa e quer vingar o irm\xE3o.",feedback:"N\xE3o h\xE1 sinal de vingan\xE7a: a cena final \xE9 de al\xEDvio e planos."},{text:"Que ela se torna l\xEDder religiosa da fam\xEDlia.",feedback:"N\xE3o h\xE1 essa informa\xE7\xE3o no texto."},{text:"Que ela abandona a fam\xEDlia para estudar m\xFAsica.",feedback:"Ela segue com a fam\xEDlia; o texto fala de planos de casamento, n\xE3o de estudos."},{text:"Que ela amadureceu e passa a ser vista como uma jovem pronta para a vida adulta, enquanto Gregor fica para tr\xE1s."}],correct:3,hints:["O que os pais notam em Grete durante o passeio?","Compare a Grete cuidadosa do in\xEDcio com a Grete do final."],explanation:"No final, os pais percebem que Grete se tornou uma jovem desenvolvida e pensam em um bom casamento para ela. O corpo jovem que se estica no \xFAltimo gesto contrasta com o corpo im\xF3vel de Gregor: a vida segue sem ele."},{id:"m5-q4",type:"single",skill:"interpretation",prompt:"Qual leitura re\xFAne melhor os elementos que voc\xEA investigou (trabalho, fam\xEDlia, porta, m\xFAsica, ma\xE7\xE3)?",options:[{text:"A fam\xEDlia abandona Gregor por maldade gratuita, sem nenhuma rela\xE7\xE3o com dinheiro ou rotina.",feedback:"O texto liga as atitudes da fam\xEDlia a press\xF5es concretas: dinheiro, cansa\xE7o, medo e vergonha diante dos outros. Isso n\xE3o justifica tudo, mas ajuda a entender."},{text:"Gregor \xE9 valorizado enquanto sustenta a casa; ao perder essa fun\xE7\xE3o, \xE9 isolado e tratado como peso, e a fam\xEDlia segue em frente sem ele."},{text:"Gregor se transforma porque deseja escapar do trabalho, e o texto aprova esse desejo.",feedback:"A transforma\xE7\xE3o n\xE3o aparece como escolha de Gregor, e o texto n\xE3o a trata como liberta\xE7\xE3o: ele sofre e se isola."},{text:"O narrador condena Grete e defende o pai como \xFAnico respons\xE1vel pelo cuidado de Gregor.",feedback:"O narrador n\xE3o faz julgamentos expl\xEDcitos, e o pai \xE9, em v\xE1rios momentos, o mais violento com Gregor."}],correct:1,hints:["Volte ao Caderno: que pistas falam de dinheiro, de utilidade e de isolamento?","Boas interpreta\xE7\xF5es se apoiam em fatos; descarte as que contradizem o que acontece na hist\xF3ria."],explanation:"A leitura mais consistente liga os fatos: a utilidade econ\xF4mica de Gregor sustenta o carinho da fam\xEDlia, e, quando ela desaparece, o isolamento e a rejei\xE7\xE3o aumentam. \xC9 uma leitura apoiada em cenas concretas do texto."},{id:"m5-q5",type:"multi",skill:"inference",prompt:"Marque as evid\xEAncias do isolamento progressivo de Gregor na casa.",options:[{text:"A porta do quarto \xE9 mantida fechada ou entreaberta conforme a conveni\xEAncia da fam\xEDlia."},{text:"Grete passa a empurrar a comida para dentro do quarto sem se preocupar com o gosto dele."},{text:"O quarto vira dep\xF3sito de coisas que a fam\xEDlia n\xE3o quer mais."},{text:"A fam\xEDlia convida Gregor para as ceias de Natal."},{text:"Os inquilinos passam a tratar Gregor como amigo."}],correct:[0,1,2],feedbackWrong:"Releia as pistas: o isolamento de Gregor cresce quando a porta se fecha, quando o cuidado vira rotina apressada e quando o quarto vira dep\xF3sito. Nenhuma cena mostra a fam\xEDlia o convidando para festas, nem os inquilinos o tratando como amigo.",hints:["Procure sinais de que a aten\xE7\xE3o da fam\xEDlia diminui com o tempo.","Tr\xEAs op\xE7\xF5es mostram abandono progressivo; duas imaginam uma aproxima\xE7\xE3o que n\xE3o acontece."],explanation:"A porta, a comida e o quarto v\xE3o mostrando, passo a passo, como Gregor deixa de ser tratado como membro da fam\xEDlia e passa a ser tratado como um problema."},{id:"m5-q6",type:"single",skill:"interpretation",prompt:"De que ponto de vista acompanhamos quase toda a hist\xF3ria?",options:[{text:"De um narrador em primeira pessoa: o pr\xF3prio Gregor conta tudo.",feedback:"O narrador \xE9 de terceira pessoa: ele n\xE3o diz \u201Ceu\u201D, apesar de acompanhar de perto o que Gregor sente."},{text:"De um narrador que conhece igualmente os pensamentos de todos os personagens.",feedback:"Quase tudo \xE9 visto pelo lado de Gregor; s\xF3 no final, depois da morte dele, o foco passa para a fam\xEDlia."},{text:"De cartas trocadas entre os membros da fam\xEDlia.",feedback:"A hist\xF3ria n\xE3o \xE9 contada por cartas."},{text:"De um narrador em terceira pessoa que acompanha de perto o que Gregor percebe e pensa."}],correct:3,hints:["O narrador diz \u201Ceu\u201D em algum momento?","De quem s\xE3o os pensamentos que mais conhecemos?"],explanation:"O narrador \xE9 de terceira pessoa, mas fica colado em Gregor: sabemos o que ele sente, pensa e percebe. S\xF3 no fim, depois da morte do personagem, o foco passa para a fam\xEDlia."},{id:"m5-q7",type:"reflect",prompt:"O Grande Enigma: em sua opini\xE3o, quem (ou o que) \xE9 o verdadeiro \u201Cmonstro\u201D da hist\xF3ria? Defenda sua ideia com pelo menos uma pista que voc\xEA encontrou."}],review:{passage:"A hist\xF3ria percorre tr\xEAs grandes momentos: o despertar de Gregor transformado, a vida em casa, com a ferida das ma\xE7\xE3s e a chegada dos inquilinos, e o desfecho, em que Gregor morre e a fam\xEDlia, aliviada, sai para passear e faz planos.",questions:[{id:"m5-r1",type:"single",prompt:"Quem encontra Gregor morto?",options:[{text:"A faxineira."},{text:"O gerente."},{text:"Um inquilino."},{text:"A m\xE3e."}],correct:0,explanation:"A faxineira \xE9 quem encontra Gregor morto e d\xE1 a not\xEDcia \xE0 fam\xEDlia."},{id:"m5-r2",type:"single",prompt:"O que a fam\xEDlia faz depois da morte de Gregor?",options:[{text:"Entra em luto por meses."},{text:"Sai para um passeio e faz planos."},{text:"Investiga a transforma\xE7\xE3o."},{text:"Muda de pa\xEDs."}],correct:1,explanation:"A fam\xEDlia sai para um passeio e pensa no futuro, com al\xEDvio."},{id:"m5-r3",type:"single",prompt:"Qual \xE9 a primeira cena da novela?",options:[{text:"A morte de Gregor."},{text:"O passeio da fam\xEDlia."},{text:"Gregor acordando transformado."},{text:"A chegada dos inquilinos."}],correct:2,explanation:"A novela come\xE7a com Gregor acordando transformado."}]}};var it=[Hs,Fs,Ws,Bs,Us];var Cc={...vt,missions:it};var Vs="Bem-vindo \xE0 Liga dos Leitores! Muitos mundos liter\xE1rios est\xE3o esperando por um explorador capaz de descobrir seus segredos. Cada livro guarda pistas, personagens e desafios. Prepare-se para come\xE7ar sua jornada!",Qs=[{id:"metamorfose",titulo:"A Metamorfose",autor:"Franz Kafka",cor:"#7a4fd0",desc:"Um caixeiro-viajante acorda transformado num inseto monstruoso e a vida da fam\xEDlia muda para sempre.",mundo:"O Enigma da Metamorfose"},{id:"anne",titulo:"O Di\xE1rio de Anne Frank",autor:"Anne Frank",cor:"#8a4fd0",desc:"O di\xE1rio de uma menina que vive escondida com a fam\xEDlia durante a Segunda Guerra Mundial.",mundo:"Opera\xE7\xE3o Anexo Secreto"},{id:"vidas",titulo:"Vidas Secas",autor:"Graciliano Ramos",cor:"#d8453d",desc:"Uma fam\xEDlia de retirantes enfrenta a seca e a dureza do sert\xE3o nordestino.",mundo:"Sobreviventes do Sert\xE3o"},{id:"iracema",titulo:"Iracema",autor:"Jos\xE9 de Alencar",cor:"#e0932a",desc:"Romance indianista que mistura lenda, amor e o encontro entre povos nas terras do Cear\xE1.",mundo:"Os Segredos de Iracema"},{id:"cartomante",titulo:"A Cartomante",autor:"Machado de Assis",cor:"#3fa86a",desc:"Um conto sobre uma consulta \xE0 cartomante, uma amizade e um segredo que muda o destino de tr\xEAs pessoas.",mundo:"O Mist\xE9rio da Cartomante"},{id:"alienista",titulo:"O Alienista",autor:"Machado de Assis",cor:"#3b6fd0",desc:"Um m\xE9dico decide quem \xE9 s\xE3o e quem \xE9 louco em Itagua\xED, e a cidade vira do avesso.",mundo:"Os Arquivos do Alienista"}],go={anne:"Um esconderijo, um di\xE1rio e a coragem de escrever sobre dias dif\xEDceis.",vidas:"Uma fam\xEDlia atravessa o sert\xE3o em busca de \xE1gua, trabalho e dignidade.",iracema:"Lendas, rios e encontros entre culturas nas terras do Cear\xE1.",cartomante:"Uma previs\xE3o, um segredo e uma d\xFAvida que muda o destino de tr\xEAs pessoas.",alienista:"Uma cidade, uma casa de sa\xFAde e um m\xE9dico que decide quem \xE9 s\xE3o."},vo={id:"ch-vila",world:"desafios",n:0,builtin:!0,exemplo:!0,titulo:"Desafio da Vila: estrat\xE9gias de leitura",resumo:"Tr\xEAs perguntas r\xE1pidas sobre como ler com aten\xE7\xE3o. Um aquecimento para qualquer livro.",contexto:["Na Vila dos Leitores, ler \xE9 um trabalho de detetive. Antes de enfrentar os grandes mundos, a Mirela prop\xF5e um aquecimento sobre estrat\xE9gias que ajudam em qualquer leitura."],objetivo:"Reconhecer estrat\xE9gias que ajudam a compreender melhor um texto.",instrucoes:"Responda \xE0s tr\xEAs perguntas. Se errar, voc\xEA ganha uma explica\xE7\xE3o e pode tentar de novo.",explorar:[],minClues:0,criterio:"Responder corretamente a todas as perguntas.",fechamento:"Bo para comparar com a diagn\xF3stica e ver o quanto voc\xEA avan\xE7ou."}},Go={pre:{texto:["Todas as noites, Dona Estela subia os cento e doze degraus do farol da Ponta Seca para acender a l\xE2mpada grande. Fazia isso havia trinta anos, desde que o marido, o velho Aur\xE9lio, deixara de enxergar bem. Nunca reclamava; dizia apenas que os degraus eram o seu rel\xF3gio.","Numa noite de neblina, um menino chamado Teo bateu \xE0 porta, ofegante: o barco do pai ainda n\xE3o voltara. Estela olhou pela janela, onde o mar sumia no branco, e guardou o tric\xF4 sem terminar a fileira. Acendeu a l\xE2mpada, mas a luz mal atravessava a bruma. Ent\xE3o desceu at\xE9 a praia, pendurou uma lanterna no mastro velho e, com o menino, passou a bater um sino de ferro, tr\xEAs toques e uma pausa, at\xE9 o amanhecer.","Quando o barco enfim apareceu, o pescador agradeceu pela luz. Estela sorriu e olhou para o sino: \u2014 Foi ele quem chamou."],questions:[{id:"dg-pre-1",skill:"explicit",prompt:"H\xE1 quanto tempo Dona Estela acendia a l\xE2mpada do farol?",options:["Havia doze anos, desde que Teo nasceu.","Havia cento e doze anos, desde que o farol foi constru\xEDdo.","Havia trinta anos, desde que o marido deixou de enxergar bem.","Desde a noite de neblina em que Teo bateu \xE0 porta."],correct:2,explanation:"O primeiro par\xE1grafo diz com todas as letras: \u201CFazia isso havia trinta anos, desde que o marido (\u2026) deixara de enxergar bem\u201D. \xC9 uma informa\xE7\xE3o expl\xEDcita: est\xE1 escrita no texto. Os outros n\xFAmeros e nomes aparecem em outros trechos e confundem quem l\xEA depressa."},{id:"dg-pre-2",skill:"inference",prompt:"Quando Estela guarda o tric\xF4 \u201Csem terminar a fileira\u201D, o texto sugere que ela...",options:["ficou irritada com a visita do menino.","percebeu que a situa\xE7\xE3o era urgente e decidiu agir sem demora.","preferia tricotar a ajudar o menino.","j\xE1 havia terminado todo o trabalho."],correct:1,explanation:"O texto n\xE3o diz \u201Cela percebeu a urg\xEAncia\u201D, mas deixa pistas: ela guarda o tric\xF4 pela metade e logo age. Concluir isso a partir das pistas \xE9 fazer uma infer\xEAncia."},{id:"dg-pre-3",skill:"character",prompt:"Que caracter\xEDstica de Estela aparece nas atitudes dela durante a noite de neblina?",options:["Solidariedade e iniciativa: ela age para ajudar, mesmo quando o m\xE9todo de sempre falha.","Indiferen\xE7a: ela s\xF3 cumpre a rotina.","Medo: ela se esconde em casa.","Vaidade: ela quer ser elogiada pelo pescador."],correct:0,explanation:"Os personagens se revelam pelo que fazem. Estela acende a l\xE2mpada, percebe que n\xE3o basta e inventa outro modo de ajudar: desce \xE0 praia e toca o sino. Isso mostra solidariedade e iniciativa."},{id:"dg-pre-4",skill:"symbol",prompt:"No texto, a neblina que faz o mar \u201Csumir no branco\u201D pode ser entendida como s\xEDmbolo de...",options:["tranquilidade e descanso.","velhice e esquecimento.","a alegria do reencontro.","uma situa\xE7\xE3o de incerteza e perigo, em que o caminho deixa de ser vis\xEDvel."],correct:3,explanation:"Um s\xEDmbolo \xE9 uma imagem que representa uma ideia. A neblina esconde o mar e o caminho do barco: ela representa a incerteza e o perigo, e \xE9 por isso que a luz comum n\xE3o basta."},{id:"dg-pre-5",skill:"interpretation",prompt:"Qual destas ideias resume melhor o sentido do texto?",options:["As pessoas mais velhas s\xE3o sempre mais corajosas do que as crian\xE7as.","Quando o recurso de sempre n\xE3o basta, \xE9 preciso inventar outro modo de ajudar.","O mar \xE9 perigoso demais para quem vive de pesca.","As crian\xE7as n\xE3o devem sair de casa \xE0 noite."],correct:1,explanation:"A ideia central une os fatos do texto: a luz n\xE3o atravessou a neblina, ent\xE3o Estela criou outra solu\xE7\xE3o (o sino). As outras alternativas falam de detalhes ou de ideias que o texto n\xE3o defende."},{id:"dg-pre-6",skill:"sequence",prompt:"Qual alternativa apresenta os fatos na ordem em que acontecem na noite de neblina?",options:["Estela bate o sino \u2192 Teo bate \xE0 porta \u2192 o barco aparece \u2192 Estela acende a l\xE2mpada.","Teo bate \xE0 porta \u2192 Estela pendura a lanterna e bate o sino \u2192 Estela acende a l\xE2mpada \u2192 o barco aparece.","Teo bate \xE0 porta \u2192 Estela acende a l\xE2mpada, mas a luz mal atravessa a bruma \u2192 ela pendura a lanterna e bate o sino \u2192 o barco aparece.","O barco aparece \u2192 Teo bate \xE0 porta \u2192 Estela acende a l\xE2mpada \u2192 ela bate o sino."],correct:2,explanation:"Primeiro vem o pedido de ajuda (Teo), depois a tentativa de sempre (a l\xE2mpada), depois a solu\xE7\xE3o nova (lanterna e sino) e, por \xFAltimo, a chegada do barco."}]},post:{texto:["Seu Nando dirigia o \xF4nibus da linha 7 e guardava, no porta-luvas, um caderno de capa azul. Em cada ponto final, enquanto esperava o hor\xE1rio de partida, anotava uma frase que ouvira durante o trajeto: um pedido de desculpas, uma piada de crian\xE7a, uma saudade dita em voz baixa. Os colegas riam: \u2014 Est\xE1 escrevendo o qu\xEA, Nando? Um livro? Ele s\xF3 dava de ombros.","No dia em que se aposentou, os passageiros encontraram, no lugar do banco do fundo, uma estante pequena com um cartaz: \u201CFrases de viagem \u2014 leve uma, deixe outra\u201D. Dentro, havia c\xF3pias de p\xE1ginas do caderno azul, uma frase em cada papel dobrado. Dona L\xFAcia, que costumava se sentar ali, leu o primeiro bilhete e demorou a descer. \u2014 Isto \xE9 meu \u2014 murmurou. \u2014 Eu disse isso ao telefone, h\xE1 dois anos. De longe, Seu Nando fingiu n\xE3o ouvir, mas ajeitou o bon\xE9 e sorriu."],questions:[{id:"dg-post-1",skill:"explicit",prompt:"Onde Seu Nando guardava o caderno de capa azul?",options:["Numa estante no fundo do \xF4nibus.","Na casa de Dona L\xFAcia.","No ponto final da linha 7.","No porta-luvas do \xF4nibus."],correct:3,explanation:"O texto informa logo no in\xEDcio: \u201Cguardava, no porta-luvas, um caderno de capa azul\u201D. \xC9 uma informa\xE7\xE3o expl\xEDcita. A estante s\xF3 aparece depois, e guarda c\xF3pias das p\xE1ginas, n\xE3o o caderno."},{id:"dg-post-2",skill:"inference",prompt:"Quando Dona L\xFAcia diz \u201CIsto \xE9 meu\u201D, o leitor pode concluir que...",options:["Seu Nando anotou uma frase que ela mesma tinha dito durante uma viagem.","ela escreveu o caderno azul inteiro.","ela queria ficar com a estante.","ela n\xE3o gostou de ver a estante no \xF4nibus."],correct:0,explanation:"Ela explica: \u201CEu disse isso ao telefone, h\xE1 dois anos\u201D. Ligando essa fala ao h\xE1bito de Nando de anotar o que ouvia, conclu\xEDmos que a frase do bilhete era dela. Isso \xE9 infer\xEAncia."},{id:"dg-post-3",skill:"character",prompt:"O que a atitude de Seu Nando, ao fingir n\xE3o ouvir e sorrir, revela sobre ele?",options:["Ele \xE9 arrogante e quer aplausos.","Ele \xE9 indiferente aos passageiros.","Ele \xE9 discreto e se alegra em ver o efeito do que fez, sem querer aten\xE7\xE3o.","Ele est\xE1 irritado com Dona L\xFAcia."],correct:2,explanation:"Ele observa de longe, finge n\xE3o ouvir, mas ajeita o bon\xE9 e sorri: gosta do resultado, por\xE9m n\xE3o procura ser o centro das aten\xE7\xF5es. Isso \xE9 ser discreto."},{id:"dg-post-4",skill:"symbol",prompt:"A estante colocada no lugar do banco do fundo pode ser entendida como s\xEDmbolo de...",options:["o fim da linha 7.","pequenas lembran\xE7as dos passageiros que ganham lugar e passam a ser compartilhadas.","a pressa da cidade grande.","a rivalidade entre os motoristas."],correct:1,explanation:"A estante guarda frases de passageiros e as devolve a todos: representa as pequenas lembran\xE7as do dia a dia ganhando um lugar para serem compartilhadas."},{id:"dg-post-5",skill:"interpretation",prompt:"Qual \xE9 a ideia central do texto?",options:["Prestar aten\xE7\xE3o \xE0s pequenas falas do dia a dia pode transform\xE1-las em um presente para todos.","Os motoristas de \xF4nibus costumam escrever livros.","Ningu\xE9m deve anotar o que ouve dos outros.","As aposentadorias acontecem sempre de surpresa."],correct:0,explanation:"O texto mostra o caminho: Nando anota frases ouvidas, depois as devolve aos passageiros. A ideia central \xE9 o valor de prestar aten\xE7\xE3o ao cotidiano e compartilh\xE1-lo."},{id:"dg-post-6",skill:"sequence",prompt:"Qual alternativa apresenta os fatos na ordem em que acontecem?",options:["Dona L\xFAcia reconhece uma frase \u2192 Nando anota frases nos pontos finais \u2192 Nando se aposenta \u2192 os passageiros encontram a estante.","Nando se aposenta \u2192 Nando anota frases nos pontos finais \u2192 os passageiros encontram a estante \u2192 Dona L\xFAcia reconhece uma frase.","Nando anota frases nos pontos finais \u2192 Nando se aposenta \u2192 os passageiros encontram a estante \u2192 Dona L\xFAcia reconhece uma frase.","Nando anota frases nos pontos finais \u2192 os passageiros encontram a estante \u2192 Nando se aposenta \u2192 Dona L\xFAcia reconhece uma frase."],correct:2,explanation:"Primeiro ele anota (durante o trabalho), depois se aposenta, no dia seguinte os passageiros encontram a estante e s\xF3 ent\xE3o Dona L\xFAcia l\xEA o bilhete e reconhece a frase."}]}};function Gr(a,e){let t=Go[a];if(!t)return null;let o={},s=[],r=0;for(let n of t.questions){let l=Number(e[n.id]),d=Number.isInteger(l)&&l===n.correct;d&&r++;let c=o[n.skill]||(o[n.skill]={n:0,ok:0});c.n++,d&&c.ok++,s.push({q:n.id,a:Number.isInteger(l)?l:null,ok:d})}return{v:1,score:r,total:t.questions.length,bySkill:o,answers:s}}ue();function _r(a,e){let t=a.gateway;if(!t||!Go[e])return null;let o=Go[e],s=jo[e],r=o.questions,n=i("div",{class:"diag"}),l=X(n,{title:s.titulo,wide:!0,cls:"quiz-modal"}),d={},c=0,u=(h=!0)=>{let v=i("details",{class:"ctx-box diag-text"},i("summary",{class:"ctx-tag"},"Texto"),...o.texto.map(x=>i("p",{},x)));return v.open=h,v},p=()=>{n.innerHTML="";let h=t.p.diag[e];if(h)return f(h,!0);n.append(i("p",{class:"quiz-lead"},s.resumo),i("div",{class:"callout info"},"Isto n\xE3o \xE9 uma nota: n\xE3o
