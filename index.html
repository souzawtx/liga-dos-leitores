<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1330">
<meta name="color-scheme" content="dark">
<title>Liga dos Leitores</title>
<style>/* Liga dos Leitores — base: tokens, reset, palco do jogo, HUD, botões */
:root {
  --ink: #2a1f3d; --ink-soft: #5b4b70; --ink-faint: #62527a;
  --parch: #f7efd9; --parch-2: #efe2c0; --parch-3: #e4d3a6; --parch-edge: #b79a55;
  --night: #1a1330; --night-2: #261a47; --night-3: #3a2a66; --night-4: #54418f;
  --gold: #ffd24a; --gold-d: #c88a1a; --gold-l: #fff0b0; --gold-text: #7d4f00;
  --violet: #7a4fd0; --violet-l: #b59cff;
  --teal: #2f9a6a; --red: #d8453d; --blue: #3b6fd0;
  --ok: #1f7a50; --ok-bg: #dff3e6; --bad: #a8302a; --bad-bg: #fbe3df; --warn-bg: #fff1c9;
  --radius: 14px; --radius-s: 9px;
  --shadow: 0 12px 34px rgba(8, 4, 24, .5);
  --fs: 16px;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: Georgia, "Palatino Linotype", "Book Antiqua", Palatino, serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
.hc {
  --ink: #000; --ink-soft: #1a1030; --ink-faint: #2a2040;
  --parch: #fffdf4; --parch-2: #fff6d6; --parch-3: #ffe9a8; --parch-edge: #000;
  --night: #000; --night-2: #0a0620; --night-3: #1a1040; --night-4: #3a2a80;
  --gold: #ffe14a; --gold-text: #5a3a00; --ok: #0b5c36; --bad: #8a0f0a;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night); color: #fff; overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--font-ui); font-size: var(--fs); line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ico { display: inline-block; vertical-align: -0.14em; }

.app { position: fixed; inset: 0; overflow: hidden; background: #0e0a1e; user-select: none; -webkit-user-select: none; }
#stage { position: absolute; inset: 0; overflow: hidden; background: #0e0a1e; }
#game { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }

/* ---------- carregamento ---------- */
.boot { position: absolute; inset: 0; z-index: 90; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #35256b 0%, #1a1330 70%); transition: opacity .45s; }
.boot.out { opacity: 0; pointer-events: none; }
.boot-card { text-align: center; padding: 28px 34px; }
.boot-title { font-family: var(--font-display); font-size: clamp(30px, 6vw, 52px); font-weight: 700; letter-spacing: .02em; color: var(--gold); text-shadow: 0 3px 0 #7a4a08, 0 8px 24px rgba(0, 0, 0, .5); }
.boot-sub { margin-top: 10px; color: #d9ccff; }
.boot-bar { margin: 18px auto 0; width: min(260px, 70vw); height: 8px; border-radius: 8px; background: #2c2058; overflow: hidden; }
.boot-bar i { display: block; height: 100%; width: 40%; border-radius: 8px; background: linear-gradient(90deg, var(--violet), var(--gold)); animation: bootbar 1.1s ease-in-out infinite; }
@keyframes bootbar { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }

/* ---------- botões ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5em; min-height: 44px; padding: 10px 20px; border-radius: 12px; border: 2px solid transparent; font-weight: 700; letter-spacing: .01em; transition: transform .08s, filter .15s, background .15s; text-align: center; }
.btn:active { transform: translateY(1px) scale(.99); }
.btn[disabled], .btn.disabled { opacity: .5; cursor: not-allowed; filter: grayscale(.4); }
.btn.primary { background: linear-gradient(#ffd24a, #f0a820); color: #3a2300; border-color: #b9741a; box-shadow: 0 3px 0 #b9741a, 0 8px 16px rgba(0, 0, 0, .25); }
.btn.primary:hover:not([disabled]) { filter: brightness(1.06); }
.btn.secondary { background: var(--night-3); color: #fff; border-color: var(--night-4); box-shadow: 0 3px 0 #16103a; }
.btn.secondary:hover:not([disabled]) { background: var(--night-4); }
.btn.ghost { background: transparent; color: inherit; border-color: currentColor; opacity: .85; }
.btn.ghost:hover:not([disabled]) { opacity: 1; background: rgba(127, 100, 200, .12); }
.btn.danger { background: #c43b3b; color: #fff; border-color: #8f2323; box-shadow: 0 3px 0 #8f2323; }
.btn.good { background: #2f9a6a; color: #fff; border-color: #1f7a50; box-shadow: 0 3px 0 #1f7a50; }
.btn.small { min-height: 36px; padding: 6px 14px; font-size: .9em; border-radius: 10px; }
.btn.block { display: flex; width: 100%; }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--night-4); background: rgba(38, 26, 71, .92); color: #fff; font-size: 22px; line-height: 1; transition: background .15s, transform .08s; }
.icon-btn:hover { background: var(--night-4); }
.icon-btn:active { transform: scale(.95); }
.icon-btn .ico { width: 1.15em; height: 1.15em; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
.row.center { justify-content: center; }
.grow { flex: 1 1 auto; }
.muted { color: var(--ink-faint); }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* ---------- HUD ---------- */
.hud { position: absolute; inset: 0; pointer-events: none; z-index: 20; padding: calc(10px + var(--safe-t)) calc(12px + var(--safe-r)) 10px calc(12px + var(--safe-l)); }
.hud > * { pointer-events: auto; }
.hud-left { position: absolute; left: calc(12px + var(--safe-l)); top: calc(10px + var(--safe-t)); display: flex; gap: 10px; align-items: center; padding: 8px 14px 8px 8px; border-radius: 16px; background: rgba(26, 19, 48, .82); border: 2px solid var(--night-4); backdrop-filter: blur(4px); max-width: min(330px, 62vw); }
.hud-avatar { width: 52px; height: 52px; padding: 3px; border-radius: 12px; border: 2px solid var(--gold); background: linear-gradient(#4a3a86, #2c2058); flex: none; }
.hud-avatar canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
.hud-info { min-width: 0; flex: 1 1 auto; }
.hud-name { font-weight: 800; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-level { font-size: .78rem; color: var(--violet-l); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xpbar { height: 9px; margin-top: 4px; border-radius: 6px; background: #10091f; border: 1px solid #54418f; overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7a4fd0, #ffd24a); transition: width .5s; }
.hud-xp-text { margin-top: 2px; font-size: .7rem; color: #cfc2f5; font-variant-numeric: tabular-nums; }
.hud-right { position: absolute; right: calc(12px + var(--safe-r)); top: calc(10px + var(--safe-t)); display: flex; gap: 8px; align-items: center; }
.hud-chips, .hud-buttons { display: flex; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 6px 12px; border-radius: 12px; font-weight: 800; background: rgba(26, 19, 48, .86); border: 2px solid var(--night-4); font-variant-numeric: tabular-nums; }
.chip .ico { width: 1.25em; height: 1.25em; }
.chip.hearts { gap: 3px; }
.chip.hearts .ico { color: #ff5a62; width: 1.3em; height: 1.3em; }
.chip.hearts .ico.off { color: #6b5a8a; }
.chip.pop { animation: chippop .5s; }
@keyframes chippop { 40% { transform: scale(1.18); filter: brightness(1.4); } }
.hud-save { position: absolute; left: calc(12px + var(--safe-l)); top: calc(100px + var(--safe-t)); font-size: .72rem; padding: 2px 9px; border-radius: 999px; background: rgba(26, 19, 48, .7); color: #b9ffd8; opacity: 0; transition: opacity .4s; pointer-events: none; }
.hud-save.show { opacity: 1; }
.hud-save.err { opacity: 1; background: #8a1f1f; color: #fff; pointer-events: auto; padding: 5px 12px; font-size: .8rem; font-weight: 700; border: 2px solid #ffb4ae; }
.hud-zone { position: absolute; top: calc(78px + var(--safe-t)); left: 50%; transform: translate(-50%, -14px); padding: 8px 22px; border-radius: 999px; font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--gold-l); background: rgba(26, 19, 48, .88); border: 2px solid var(--gold-d); opacity: 0; transition: opacity .5s, transform .5s; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
.hud-zone.show { opacity: 1; transform: translate(-50%, 0); }
.hud-goal { position: absolute; right: calc(12px + var(--safe-r)); top: calc(66px + var(--safe-t)); max-width: min(300px, 52vw); padding: 8px 12px; border-radius: 12px; font-size: .82rem; line-height: 1.35; background: rgba(26, 19, 48, .82); border: 2px solid var(--night-4); }
.hud-goal b { color: var(--gold); display: block; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }

/* dica de interação */
.prompt { position: absolute; left: 50%; bottom: calc(26px + var(--safe-b)); transform: translateX(-50%); z-index: 22; display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px 9px 10px; border-radius: 999px; background: rgba(26, 19, 48, .92); border: 2px solid var(--gold-d); font-weight: 700; pointer-events: auto; cursor: pointer; max-width: 92vw; }
.prompt kbd { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 8px; background: var(--gold); color: #3a2300; font-family: var(--font-mono); font-weight: 800; border-bottom: 3px solid #b9741a; }
.prompt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.is-touch .prompt { display: none; }

/* Janelas modais, avisos, caixa de diálogo e controles de toque */
#ui-root { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
.modal-backdrop { position: absolute; inset: 0; z-index: 100; display: grid; place-items: center; padding: calc(14px + var(--safe-t)) calc(14px + var(--safe-r)) calc(14px + var(--safe-b)) calc(14px + var(--safe-l)); background: rgba(10, 6, 28, .72); backdrop-filter: blur(3px); pointer-events: auto; animation: fadein .2s; }
@keyframes fadein { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 20px; background: var(--parch); color: var(--ink); border: 3px solid var(--parch-edge); box-shadow: var(--shadow), inset 0 0 0 3px rgba(255, 255, 255, .45); animation: popin .22s cubic-bezier(.2, 1.3, .4, 1); overflow: hidden; }
.modal.wide { width: min(980px, 100%); }
.modal.dark { background: var(--night-2); color: #fff; border-color: var(--night-4); box-shadow: var(--shadow); }
@keyframes popin { from { transform: translateY(14px) scale(.96); opacity: 0; } }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px 20px; border-bottom: 2px dashed rgba(120, 90, 30, .3); }
.modal.dark .modal-head { border-bottom-color: rgba(255, 255, 255, .15); }
.modal-title { margin: 0; flex: 1 1 auto; font-family: var(--font-display); font-size: 1.35rem; line-height: 1.2; }
.modal .icon-btn.close { background: var(--parch-2); color: var(--ink); border-color: var(--parch-edge); width: 40px; height: 40px; font-size: 26px; }
.modal-body { padding: 16px 20px 20px; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.modal h3 { font-family: var(--font-display); margin: 18px 0 8px; font-size: 1.1rem; }
.modal p { margin: 0 0 10px; }
.modal .btn.ghost { color: var(--ink); }
.modal.dark .btn.ghost { color: #fff; }
.modal .btn.secondary { background: var(--parch-3); color: var(--ink); border-color: var(--parch-edge); box-shadow: 0 3px 0 var(--parch-edge); }
.modal .btn.secondary:hover:not([disabled]) { background: #ead7a2; }
.modal.dark .btn.secondary { background: var(--night-3); color: #fff; border-color: var(--night-4); box-shadow: 0 3px 0 #16103a; }
.confirm p { font-size: 1.02rem; }

/* campos */
label.field { display: block; font-weight: 700; margin: 10px 0; }
label.field > span.lbl { display: block; margin-bottom: 4px; font-size: .88rem; color: var(--ink-soft); }
.modal.dark label.field > span.lbl { color: #cdbff5; }
input[type=text], input[type=password], input[type=number], input[type=search], select, textarea {
  width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 10px; border: 2px solid var(--parch-edge); background: #fffdf5; color: var(--ink); font-weight: 500; user-select: text; -webkit-user-select: text; }
textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
.modal.dark input, .modal.dark select, .modal.dark textarea { background: #170f30; color: #fff; border-color: var(--night-4); }
input[type=checkbox], input[type=radio] { width: 22px; height: 22px; accent-color: var(--violet); vertical-align: middle; }
input[type=range] { width: 100%; accent-color: var(--violet); }
.hint-text { font-size: .85rem; color: var(--ink-faint); margin: 4px 0 0; font-weight: 500; }
.modal.dark .hint-text { color: #b4a6dd; }
.callout { padding: 10px 14px; border-radius: 12px; background: var(--warn-bg); border: 2px solid #e6c15a; color: #4a3500; font-size: .92rem; margin: 10px 0; }
.callout.info { background: #e6edff; border-color: #9db4f0; color: #1b2c5c; }
.callout.bad { background: var(--bad-bg); border-color: #e58e86; color: #5a130e; }
.callout.good { background: var(--ok-bg); border-color: #8fd1ad; color: #0f3d27; }
.tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--parch-3); color: var(--ink); font-size: .78rem; font-weight: 800; border: 1px solid var(--parch-edge); }
.tag.violet { background: #e5dcff; border-color: #a78bff; color: #35207a; }
.tag.green { background: var(--ok-bg); border-color: #8fd1ad; color: #0f3d27; }
.tag.red { background: var(--bad-bg); border-color: #e58e86; color: #5a130e; }
.tag.gray { background: #e8e4ef; border-color: #b5aec4; color: #3a3350; }

/* avisos */
#toasts { position: absolute; top: calc(70px + var(--safe-t)); left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(460px, 94vw); }
.toast { padding: 10px 16px; border-radius: 14px; font-weight: 700; background: rgba(26, 19, 48, .96); border: 2px solid var(--night-4); box-shadow: var(--shadow); opacity: 0; transform: translateY(-10px); transition: opacity .25s, transform .25s; text-align: center; max-width: 100%; }
.toast.in { opacity: 1; transform: none; }
.toast.good { border-color: #4fd195; }
.toast.bad { border-color: #ff7b72; }
.toast.gold { border-color: var(--gold); background: linear-gradient(#3a2a66, #261a47); color: var(--gold-l); }
.toast small { display: block; font-weight: 500; opacity: .85; margin-top: 2px; }

/* caixa de diálogo (conversas) */
#dialog-root { position: absolute; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: center; padding: 0 calc(12px + var(--safe-r)) calc(14px + var(--safe-b)) calc(12px + var(--safe-l)); pointer-events: none; }
.dialog { position: relative; width: min(760px, 100%); display: flex; gap: 14px; padding: 16px 18px 14px; border-radius: 18px; background: var(--parch); color: var(--ink); border: 3px solid var(--parch-edge); box-shadow: var(--shadow), inset 0 0 0 3px rgba(255, 255, 255, .5); pointer-events: auto; animation: slideup .22s ease-out; }
@keyframes slideup { from { transform: translateY(20px); opacity: 0; } }
.dialog-portrait { flex: none; width: 76px; height: 76px; border-radius: 14px; background: linear-gradient(#cfc0ff, #9a82e6); border: 2px solid var(--parch-edge); overflow: hidden; align-self: flex-start; }
.dialog-portrait canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.dialog-main { flex: 1 1 auto; min-width: 0; }
.dialog-name { position: absolute; top: -16px; left: 22px; padding: 3px 16px; border-radius: 999px; font-family: var(--font-display); font-weight: 700; font-size: .95rem; color: var(--gold-l); background: var(--night-2); border: 2px solid var(--gold-d); }
.dialog-text { min-height: 3.1em; font-size: 1.04rem; line-height: 1.5; margin: 6px 0 8px; white-space: pre-wrap; }
.dialog-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.dialog-next { font-size: .8rem; color: var(--ink-faint); font-weight: 700; }
.dialog-choices { display: flex; flex-wrap: wrap; gap: 8px; }
.dialog-choices .btn { min-height: 40px; padding: 7px 16px; }
.dialog .btn.secondary { background: var(--parch-3); color: var(--ink); border-color: var(--parch-edge); box-shadow: 0 3px 0 var(--parch-edge); }

/* controles de toque */
.touch-controls { position: absolute; inset: 0; z-index: 30; pointer-events: none; display: none; }
.is-touch .touch-controls { display: block; }
.touch-controls .joy { position: absolute; left: calc(18px + var(--safe-l)); bottom: calc(22px + var(--safe-b)); width: 150px; height: 150px; pointer-events: auto; touch-action: none; }
.joy-base { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(58, 42, 102, .55) 0%, rgba(26, 19, 48, .6) 70%); border: 3px solid rgba(181, 156, 255, .6); }
.joy-knob { position: absolute; left: 50%; top: 50%; width: 62px; height: 62px; margin: -31px 0 0 -31px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe48a, #e0932a); border: 3px solid #8a5a10; box-shadow: 0 4px 10px rgba(0, 0, 0, .4); }
.touch-controls .act-btn { position: absolute; right: calc(22px + var(--safe-r)); bottom: calc(40px + var(--safe-b)); width: 96px; height: 96px; border-radius: 50%; pointer-events: auto; touch-action: none; display: grid; place-content: center; text-align: center; background: radial-gradient(circle at 35% 30%, #8d6ae0, #4a2f9a); border: 4px solid rgba(255, 255, 255, .55); color: #fff; font-weight: 800; box-shadow: 0 6px 16px rgba(0, 0, 0, .45); }
.act-btn .act-key { font-size: 1.7rem; line-height: 1; }
.act-btn .act-label { font-size: .68rem; max-width: 80px; line-height: 1.1; margin-top: 2px; }
.act-btn.ready { background: radial-gradient(circle at 35% 30%, #ffe48a, #e0932a); color: #3a2300; border-color: #fff; animation: pulse 1.2s infinite; }
.act-btn.on { transform: scale(.94); }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(255, 210, 74, .25), 0 6px 16px rgba(0, 0, 0, .45); } }
.touch-controls .menu-btn { display: none; }

.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
@media (prefers-reduced-motion: reduce) {
  .boot-bar i { animation: none; width: 100%; } .act-btn.ready { animation: none; }
  /* vale para a tela inicial e para a área da professora, onde as configurações do jogo ainda não foram aplicadas */
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

@media (max-width: 640px) {
  .hud-left { padding: 6px 10px 6px 6px; max-width: min(330px, calc(100vw - 194px - var(--safe-l) - var(--safe-r))); } /* sobra espaço para moedas e botões */
  .hud-avatar { width: 44px; height: 44px; }
  .hud-xp-text { display: none; }
  .chip { padding: 4px 9px; min-height: 40px; }
  .icon-btn { width: 44px; height: 44px; }
  .hud-goal { top: calc(60px + var(--safe-t)); font-size: .76rem; }
  .modal-body { padding: 14px 14px 16px; }
  .dialog { padding: 14px 12px 10px; gap: 10px; }
  .dialog-portrait { width: 56px; height: 56px; }
  .dialog-text { font-size: .98rem; }
  .is-touch .dialog-root, .is-touch #dialog-root { padding-bottom: calc(10px + var(--safe-b)); }
}
/* celular em pé: durante uma missão os corações passam para uma 2ª linha, para o HUD nunca se sobrepor */
@media (max-width: 520px) {
  .hud-right:has(#hud-hearts:not([hidden])) { flex-direction: column-reverse; align-items: flex-end; gap: 8px; }
  .hud:has(#hud-hearts:not([hidden])) .hud-left { max-width: min(330px, calc(100vw - 184px - var(--safe-l) - var(--safe-r))); }
  .hud:has(#hud-hearts:not([hidden])) .hud-goal { top: calc(114px + var(--safe-t)); }
  .hud:has(#hud-hearts:not([hidden])) .hud-zone { top: calc(196px + var(--safe-t)); }
}
@media (max-height: 520px) {
  .is-touch .touch-controls .joy { width: 120px; height: 120px; bottom: calc(10px + var(--safe-b)); }
  .joy-knob { width: 50px; height: 50px; margin: -25px 0 0 -25px; }
  .is-touch .touch-controls .act-btn { width: 80px; height: 80px; bottom: calc(24px + var(--safe-b)); }
}

/* Telas: início, criador de personagem, perfis, menu */

/* ---------- tela inicial ---------- */
.title-screen { position: absolute; inset: 0; z-index: 50; pointer-events: auto; display: grid; place-items: center; padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b)); background: linear-gradient(rgba(14, 10, 30, .55), rgba(14, 10, 30, .78)); overflow: auto; animation: fadein .4s; }
.title-card { width: min(520px, 100%); text-align: center; }
.title-logo { font-family: var(--font-display); font-weight: 700; font-size: clamp(36px, 8vw, 64px); line-height: 1.02; letter-spacing: .01em; color: var(--gold); text-shadow: 0 3px 0 #7a4a08, 0 6px 0 #4a2c05, 0 14px 30px rgba(0, 0, 0, .55); }
.title-logo small { display: block; margin-top: 8px; font-family: var(--font-ui); font-size: clamp(14px, 2.6vw, 18px); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #d9ccff; text-shadow: none; }
.title-menu { margin: 28px auto 0; display: flex; flex-direction: column; gap: 12px; width: min(380px, 100%); }
.title-menu .btn { min-height: 54px; font-size: 1.08rem; }
.title-foot { margin-top: 22px; font-size: .82rem; color: #b9abe3; }
.title-foot .warn { display: inline-block; margin-top: 8px; padding: 6px 12px; border-radius: 10px; background: #5a1f1f; border: 2px solid #ffb4ae; color: #fff; font-weight: 700; }
.profile-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.profile-card { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 14px; background: var(--parch-2); border: 2px solid var(--parch-edge); text-align: left; width: 100%; color: var(--ink); }
.profile-card:hover { background: var(--parch-3); }
.profile-card canvas { width: 40px; height: 56px; image-rendering: pixelated; flex: none; background: linear-gradient(#cfc0ff, #9a82e6); border-radius: 8px; }
.profile-card .pc-name { font-weight: 800; }
.profile-card .pc-sub { font-size: .8rem; color: var(--ink-soft); }
.profile-card .pc-del { margin-left: auto; }

/* ---------- criador de personagem ---------- */
.modal.creator { width: min(1040px, 100%); }
.cr-body { display: grid; grid-template-columns: 272px 1fr; gap: 20px; }
.cr-left { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.cr-stage { width: 100%; padding: 16px 10px; border-radius: 18px; border: 3px solid var(--parch-edge); background: radial-gradient(circle at 50% 35%, #d9ccff, #8c74d6 80%); display: grid; place-items: center; }
.cr-preview { width: 160px; height: 224px; image-rendering: pixelated; }
.cr-right { min-width: 0; }
.cr-groups { display: flex; flex-direction: column; gap: 10px; max-height: max(250px, calc(100vh - 300px)); overflow: auto; padding-right: 6px; overscroll-behavior: contain; }
.cr-group { margin: 0; padding: 8px 12px 12px; border-radius: 12px; border: 2px solid var(--parch-edge); background: rgba(255, 255, 255, .35); }
.cr-group legend { padding: 0 8px; font-family: var(--font-display); font-weight: 700; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.swatch { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgba(0, 0, 0, .35); padding: 0; display: grid; place-items: center; transition: transform .1s; }
.swatch:hover { transform: scale(1.08); }
.swatch .sw-check { display: none; color: #fff; filter: drop-shadow(0 1px 1px #000); font-size: 18px; }
.swatch.on { border-color: var(--ink); box-shadow: 0 0 0 3px var(--gold); }
.swatch.on .sw-check { display: block; }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 72px; padding: 6px 4px 5px; border-radius: 12px; border: 2px solid var(--parch-edge); background: linear-gradient(#e6dcff, #c9b8f5); color: var(--ink); transition: transform .1s; }
.thumb:hover { transform: translateY(-2px); }
.thumb .thumb-canvas { width: 40px; height: 56px; image-rendering: pixelated; }
.thumb .thumb-name { font-size: .66rem; font-weight: 800; line-height: 1.1; text-align: center; }
.thumb.on { border-color: var(--ink); box-shadow: 0 0 0 3px var(--gold); background: linear-gradient(#fff3c4, #ffd978); }
.thumb.locked { filter: grayscale(.75) brightness(.9); }
.thumb-lock { position: absolute; right: 3px; top: 3px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--night-2); color: var(--gold); font-size: 12px; }
.cr-foot { margin-top: 14px; }
.cr-turns { flex-wrap: nowrap; gap: 6px; }
.cr-turns .btn { min-width: 40px; padding: 6px 10px; }

/* ---------- cartões, listas e abas genéricos ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.card { padding: 12px 14px; border-radius: 14px; background: var(--parch-2); border: 2px solid var(--parch-edge); }
.card h4 { margin: 0 0 4px; font-family: var(--font-display); font-size: 1.02rem; }
.card p { margin: 0 0 6px; font-size: .9rem; color: var(--ink-soft); }
.card.locked { opacity: .72; filter: grayscale(.4); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; border-bottom: 2px solid var(--parch-edge); }
.tab { padding: 9px 16px; border-radius: 12px 12px 0 0; border: 2px solid transparent; border-bottom: 0; background: transparent; font-weight: 800; color: var(--ink-soft); }
.tab[aria-selected=true] { background: var(--parch); color: var(--ink); border-color: var(--parch-edge); margin-bottom: -2px; box-shadow: inset 0 3px 0 var(--gold-d); }
.tab:hover { color: var(--ink); }
.list { display: flex; flex-direction: column; gap: 8px; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--parch-2); border: 2px solid var(--parch-edge); }
.list-item .li-main { flex: 1 1 auto; min-width: 0; }
.list-item .li-title { font-weight: 800; }
.list-item .li-sub { font-size: .85rem; color: var(--ink-soft); }
.meter { height: 12px; border-radius: 8px; background: #d9cca6; border: 1px solid var(--parch-edge); overflow: hidden; }
.meter > i { display: block; height: 100%; background: linear-gradient(90deg, #7a4fd0, #ffd24a); }
.meter.green > i { background: linear-gradient(90deg, #2f9a6a, #7ed6a4); }
.meter.red > i { background: linear-gradient(90deg, #c43b3b, #ff9a92); }
table.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.tbl th, table.tbl td { padding: 8px 10px; text-align: left; border-bottom: 1px solid rgba(120, 90, 30, .25); vertical-align: top; }
table.tbl th { font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); background: var(--parch-2); position: sticky; top: 0; }
.tbl-wrap { overflow: auto; max-height: 52vh; border: 2px solid var(--parch-edge); border-radius: 12px; }
.empty { padding: 26px 16px; text-align: center; color: var(--ink-soft); background: rgba(255, 255, 255, .35); border: 2px dashed var(--parch-edge); border-radius: 14px; }
.big-number { font-family: var(--font-display); font-size: 2rem; font-weight: 700; line-height: 1; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { padding: 12px 14px; border-radius: 14px; background: var(--parch-2); border: 2px solid var(--parch-edge); }
.kpi .k-label { font-size: .78rem; color: var(--ink-soft); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }

/* ---------- menu de pausa ---------- */
.menu-list { display: grid; gap: 10px; }
.menu-list .btn { justify-content: flex-start; padding-left: 18px; font-size: 1.02rem; }
.menu-list .btn .ico { width: 1.3em; height: 1.3em; }
.menu-sum { display: flex; align-items: center; gap: 14px; padding: 10px 12px; margin-bottom: 14px; border-radius: 14px; background: var(--parch-2); border: 2px solid var(--parch-edge); }
.menu-sum canvas { width: 56px; height: 78px; image-rendering: pixelated; background: linear-gradient(#cfc0ff, #9a82e6); border-radius: 10px; flex: none; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px dashed rgba(120, 90, 30, .3); }
.switch-row:last-child { border-bottom: 0; }
.switch-row .sr-title { font-weight: 800; }
.switch-row .sr-desc { font-size: .85rem; color: var(--ink-soft); }
.toggle { position: relative; flex: none; width: 56px; height: 32px; border-radius: 999px; border: 2px solid var(--parch-edge); background: #cdbf95; transition: background .15s; }
.toggle::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .3); transition: transform .15s; }
.toggle[aria-checked=true] { background: var(--teal); border-color: #1f7a50; }
.toggle[aria-checked=true]::after { transform: translateX(24px); }

@media (max-width: 760px) {
  .cr-body { grid-template-columns: 1fr; }
  .cr-left { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .cr-stage { width: auto; padding: 10px 16px; }
  .cr-preview { width: 110px; height: 154px; }
  .cr-groups { max-height: none; overflow: visible; }
  .thumb { width: 64px; }
}

/* O "Livro" da missão: introdução, perguntas, revisão e conclusão */
.modal.quiz-modal { width: min(860px, 100%); }
.quiz { display: flex; flex-direction: column; gap: 12px; }

/* barra superior: progresso e corações */
.quiz-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 14px; border-radius: 14px; background: var(--parch-2); border: 2px solid var(--parch-edge); }
.quiz-progress { flex: 1 1 auto; min-width: 0; }
.qp-label { font-size: .82rem; font-weight: 800; color: var(--ink-soft); margin-bottom: 4px; }
.hearts-row { display: inline-flex; gap: 4px; align-items: center; flex: none; }
.hearts-row > span { display: inline-flex; }
.hearts-row .ico { width: 1.5em; height: 1.5em; }
.hearts-row .on .ico { color: var(--red); }
.hearts-row .off .ico { color: #b9a98a; }
.hearts-row.big .ico { width: 2em; height: 2em; }
.fb-hearts .hearts-row .ico { width: 1.2em; height: 1.2em; }

/* introdução */
.quiz-lead { font-size: 1.08rem; font-weight: 600; margin: 0; }
.ctx-box { padding: 12px 16px 6px; border-radius: 14px; background: #fff9e6; border: 2px solid var(--parch-edge); border-left-width: 8px; }
.ctx-tag { display: inline-block; margin-bottom: 6px; font-size: .72rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-text); }
.ctx-box p { font-size: 1.02rem; line-height: 1.55; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.info-card { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 12px; background: var(--parch-2); border: 2px solid var(--parch-edge); font-size: .92rem; }
.info-card b { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }

/* pergunta */
.q-card { display: flex; flex-direction: column; gap: 10px; }
.q-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.q-prompt { margin: 2px 0 4px !important; font-size: 1.22rem !important; line-height: 1.4; }
.q-area.locked { opacity: .95; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #fffdf5; border: 2px solid var(--parch-edge); cursor: pointer; font-weight: 600; line-height: 1.4; transition: background .12s, border-color .12s, transform .08s; }
.opt:hover { background: var(--parch-2); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.opt-mark { flex: none; width: 26px; height: 26px; margin-top: 1px; border-radius: 50%; border: 3px solid var(--parch-edge); background: #fff; display: grid; place-items: center; }
.opt:has(input[type=checkbox]) .opt-mark { border-radius: 8px; }
.opt.on { background: #efe6ff; border-color: var(--violet); }
.opt.on .opt-mark { border-color: var(--violet); background: var(--violet); box-shadow: inset 0 0 0 4px #fff; }
.opt:has(input[type=checkbox]).on .opt-mark { box-shadow: none; background: var(--violet); }
.opt:has(input[type=checkbox]).on .opt-mark::after { content: "✓"; color: #fff; font-weight: 900; font-size: 16px; line-height: 1; }
.opt:focus-within { outline: 3px solid var(--gold); outline-offset: 2px; }
.opt.right { background: var(--ok-bg); border-color: var(--ok); }
.opt.right .opt-mark { border-color: var(--ok); background: var(--ok); box-shadow: inset 0 0 0 4px #fff; }
.opt.right::after { content: "Correta"; margin-left: auto; align-self: center; font-size: .72rem; font-weight: 900; color: var(--ok); letter-spacing: .06em; text-transform: uppercase; }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); cursor: not-allowed; }
.opt.wrong .opt-text { text-decoration: line-through; text-decoration-color: rgba(168, 48, 42, .55); color: #5a3a37; }
.opt.wrong::after { content: "Tente outra"; margin-left: auto; align-self: center; font-size: .72rem; font-weight: 900; color: var(--bad); letter-spacing: .06em; text-transform: uppercase; }
.opt.wrong .opt-mark { border-color: var(--bad); background: #fff; box-shadow: none; }
.opt.wrong .opt-mark::after { content: "✕"; color: var(--bad); font-weight: 900; font-size: 14px; line-height: 1; }
.opt:has(input:disabled):not(.right):not(.wrong) { cursor: default; opacity: .8; }

/* ordenar */
.order-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.order-item { display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 12px; border-radius: 12px; background: #fffdf5; border: 2px solid var(--parch-edge); }
.order-n { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--night-3); color: #fff; font-weight: 900; }
.order-text { flex: 1 1 auto; font-weight: 600; }
.order-btns { display: flex; gap: 6px; flex: none; }
.modal .icon-btn.small { width: 40px; height: 40px; font-size: 14px; background: var(--parch-3); color: var(--ink); border-color: var(--parch-edge); }
.modal .icon-btn.small:hover:not([disabled]) { background: #ead7a2; }
.modal .icon-btn[disabled] { opacity: .35; cursor: not-allowed; }

/* dicas, ações e retorno */
.hint-box { display: flex; flex-direction: column; }
.hint-box .callout { margin: 4px 0; }
.q-actions { margin-top: 4px; }
.fb-box:empty { display: none; }
.fb { padding: 12px 16px; border-radius: 14px; border: 2px solid; animation: popin .2s ease-out; }
.fb.good { background: var(--ok-bg); border-color: #6cc596; color: #0f3d27; }
.fb.bad { background: var(--bad-bg); border-color: #e58e86; color: #5a130e; }
.fb-title { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; display: flex; gap: 6px; align-items: center; }
.fb-reward { font-size: .92rem; margin: 2px 0 6px; }
.fb-exp { margin: 6px 0 10px !important; line-height: 1.5; }
.fb-hearts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 700; font-size: .92rem; margin: 4px 0 8px; }
.fb .row { margin-top: 6px; }

/* conclusão */
.complete { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
.cp-badge { display: grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe48a, #e0932a); border: 4px solid #8a5a10; color: #4a2c00; box-shadow: 0 6px 18px rgba(0, 0, 0, .3); animation: badgepop .6s cubic-bezier(.2, 1.4, .4, 1); }
.cp-badge .ico { width: 46px; height: 46px; }
@keyframes badgepop { from { transform: scale(.3) rotate(-30deg); opacity: 0; } }
.cp-title { margin: 6px 0 0 !important; font-size: 1.7rem !important; }
.cp-sub { color: var(--ink-soft); font-weight: 700; margin: 0 !important; }
.cp-rewards { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 10px 0 4px; }
.cp-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: var(--night-2); color: var(--gold-l); border: 2px solid var(--gold-d); font-weight: 800; }
.cp-chip .ico { color: var(--gold); width: 1.3em; height: 1.3em; }
.cp-close { max-width: 56ch; font-size: 1.04rem; line-height: 1.55; }
.complete .callout { width: 100%; max-width: 560px; }
.reflect { width: 100%; max-width: 640px; text-align: left; padding: 12px 16px; border-radius: 14px; background: var(--parch-2); border: 2px dashed var(--parch-edge); }
.reflect h4 { margin: 0 0 4px; font-family: var(--font-display); }
.reflect .row { margin-top: 8px; }

@media (max-width: 560px) {
  .quiz-bar { flex-direction: column; align-items: stretch; gap: 8px; }
  .hearts-row { align-self: flex-end; }
  .q-prompt { font-size: 1.1rem !important; }
  .opt { padding: 10px 12px; }
  .q-actions { flex-direction: column; align-items: stretch; }
  .q-actions > .row { justify-content: flex-start; }
  .q-actions > .btn { width: 100%; }
}

/* caderno do explorador */
.modal.notebook-modal { width: min(940px, 100%); }
.clue-sec { margin-bottom: 8px; }
.clue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.clue-card { display: flex; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #fffdf5; border: 2px solid var(--parch-edge); }
.clue-card h4 { margin: 0 0 4px; font-family: var(--font-display); }
.clue-card p { margin: 0 0 8px; font-size: .92rem; line-height: 1.5; }
.clue-card.missing { background: var(--parch-2); border-style: dashed; opacity: .85; }
.clue-ico { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #d9cca6; color: var(--ink-soft); }
.clue-ico.found { background: var(--gold); color: #3a2300; }
.frag-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.frag { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 16px 12px; border-radius: 16px; background: var(--parch-2); border: 2px dashed var(--parch-edge); color: var(--ink-soft); }
.frag.ok { background: linear-gradient(#fff3c4, #ffe08a); border: 2px solid var(--gold-d); color: var(--ink); }
.frag-ico { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; background: #d9cca6; }
.frag.ok .frag-ico { background: radial-gradient(circle at 35% 30%, #ffe48a, #e0932a); color: #3a2300; }
.frag-ico .ico { width: 30px; height: 30px; }

/* Biblioteca, Portal, Torre, Mercado e Desafios */
.portal-lead { font-size: 1.04rem; color: var(--ink-soft); }
td.pos { color: var(--ok); font-weight: 800; } td.neg { color: var(--bad); font-weight: 800; }
.chipbtns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chipbtn { min-height: 36px; padding: 5px 14px; border-radius: 999px; border: 2px solid var(--parch-edge); background: #fffdf5; color: var(--ink); font-weight: 800; font-size: .86rem; }
.chipbtn:hover { background: var(--parch-2); }
.chipbtn.on { background: var(--night-3); color: #fff; border-color: var(--night-3); }

/* biblioteca */
.modal.library-modal { width: min(1020px, 100%); }
.library-scroll { max-height: calc(100vh - 230px); overflow: auto; padding-right: 4px; }
.shelf { margin-top: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.book-card { display: flex; overflow: hidden; border-radius: 14px; background: var(--parch-2); border: 2px solid var(--parch-edge); }
.book-spine { flex: none; width: 16px; }
.book-main { flex: 1 1 auto; min-width: 0; padding: 12px 14px; }
.book-main h4 { margin: 0; font-family: var(--font-display); font-size: 1.12rem; }
.book-main p { margin: 6px 0 0; font-size: .9rem; color: var(--ink-soft); }
.book-world { margin: 8px 0; padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, .5); }
.diary-form { padding: 12px 14px; border-radius: 14px; background: var(--parch-2); border: 2px solid var(--parch-edge); }
.diary-entry { padding: 10px 14px; border-radius: 14px; background: #fffdf5; border: 2px solid var(--parch-edge); }
.diary-prompt { margin: 6px 0 0; padding: 6px 10px; border-left: 4px solid var(--violet-l); font-size: .88rem; font-style: italic; color: var(--ink-soft); }
.diary-text { margin: 6px 0 0 !important; white-space: pre-wrap; }

/* portal */
.modal.portal-modal { width: min(1040px, 100%); }
.worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.world-card { display: flex; flex-direction: column; overflow: hidden; border-radius: 18px; background: var(--parch-2); border: 3px solid var(--wc, var(--parch-edge)); }
.world-card.playable { grid-column: 1 / -1; flex-direction: row; }
.world-cover { flex: none; display: grid; place-items: center; width: 100%; min-height: 84px; color: #fff; background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, .35), transparent 55%), linear-gradient(135deg, var(--wc), #1a1330); }
.world-card.playable .world-cover { width: 190px; min-height: 100%; }
.world-cover .ico { width: 56px; height: 56px; }
.world-card.sealed .world-cover { filter: grayscale(.7) brightness(.8); min-height: 64px; }
.world-card.sealed .world-cover .ico { width: 36px; height: 36px; }
.world-main { flex: 1 1 auto; min-width: 0; padding: 14px 16px; }
.world-main h3 { margin: 4px 0 0 !important; }
.world-card.sealed { opacity: .92; }

/* torre */
.modal.tower-modal { width: min(980px, 100%); }
.tower-head { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 14px 18px; margin-bottom: 14px; border-radius: 16px; background: linear-gradient(135deg, var(--night-3), var(--night-2)); color: #fff; border: 2px solid var(--gold-d); }
.tower-head .meter { background: #10091f; border-color: var(--night-4); }
.tower-level-name { color: var(--gold-l); font-weight: 800; }
.tower-head .muted { color: #cdbff5; }
.tower-medals { text-align: center; }
.medal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-top: 10px; }
.medal { display: flex; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--parch-2); border: 2px dashed var(--parch-edge); color: var(--ink-soft); }
.medal.got { background: linear-gradient(#fff3c4, #ffe9a0); border: 2px solid var(--gold-d); color: var(--ink); }
.medal-ico { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: #d9cca6; color: #6a5a3a; }
.medal.got .medal-ico { background: radial-gradient(circle at 35% 30%, #ffe48a, #e0932a); color: #3a2300; border: 3px solid #8a5a10; }
.medal-ico .ico { width: 28px; height: 28px; }
.medal-main h4 { margin: 0 0 2px; font-family: var(--font-display); }
.medal-main p { margin: 0 0 6px; font-size: .9rem; }
.lvl-n { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--night-3); color: #fff; font-weight: 900; }
.list-item.current { border-color: var(--violet); background: #efe6ff; }

/* mercado */
.modal.shop-modal { width: min(980px, 100%); }
.shop-wallet { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; margin-bottom: 14px; border-radius: 999px; background: var(--night-2); color: var(--gold-l); border: 2px solid var(--gold-d); font-size: 1.05rem; }
.shop-wallet .ico { color: var(--gold); width: 1.3em; height: 1.3em; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 10px; }
.shop-item { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 16px; background: var(--parch-2); border: 2px solid var(--parch-edge); }
.shop-item h4 { margin: 4px 0 0; font-family: var(--font-display); }
.shop-item p { margin: 0 0 4px; font-size: .88rem; color: var(--ink-soft); flex: 1 1 auto; }
.shop-item.owned { background: var(--ok-bg); border-color: #6cc596; }
.shop-stage { display: grid; place-items: center; padding: 10px; border-radius: 12px; background: radial-gradient(circle at 50% 35%, #d9ccff, #8c74d6 80%); }
.shop-canvas { width: 80px; height: 112px; image-rendering: pixelated; }
.challenge-card h4 { margin: 0; }

@media (max-width: 720px) {
  .world-card.playable { flex-direction: column; }
  .world-card.playable .world-cover { width: 100%; min-height: 90px; }
  .tower-head { grid-template-columns: 1fr; text-align: center; }
  .library-scroll { max-height: none; }
  .shelf { grid-template-columns: 1fr; }
}

/* Área da professora: painel, tabelas, editor de missões, relatórios e impressão */
.modal.teacher-modal { width: min(1120px, 100%); }
.teacher-scroll { max-height: calc(100vh - 220px); overflow: auto; padding: 2px 4px 8px 2px; }
.tsec { margin: 0 0 22px; }
.tsec > h3 { margin-top: 4px; padding-bottom: 4px; border-bottom: 2px dashed rgba(120, 90, 30, .3); }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.plain { margin: 6px 0; padding-left: 18px; } .plain li { margin: 2px 0; }
.linkbtn { padding: 0; border: 0; background: none; color: var(--violet); font-weight: 800; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:hover { color: var(--night-3); }
.hc .linkbtn { color: #2a0f80; }
.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 10px; }
.filters .field { margin: 0; min-width: 190px; }
.filters .grow { flex: 1 1 auto; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 16px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0 14px; }
.worlds-admin { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.worlds-admin .card { border-width: 3px; }
.worlds-admin .switch-row { padding: 8px 0 0; border-bottom: 0; }
.tbl td .switch-row { padding: 0; }
.tbl td .toggle { margin: 0; }
.tbl td details > summary { cursor: pointer; }
.tbl td input[type=number] { min-height: 36px; width: 100%; min-width: 74px; padding: 4px 8px; }
.skill-list { display: grid; gap: 10px; }
.skill-row .meter { margin-top: 4px; }
.kpi .hint-text { margin-top: 4px; }
.recovery { margin: 14px 0; padding: 14px; text-align: center; font-family: var(--font-mono); font-size: 1.7rem; font-weight: 800; letter-spacing: .12em; color: var(--ink); background: #fff; border: 3px dashed var(--gold-d); border-radius: 12px; user-select: text; -webkit-user-select: text; }
.import-out { margin-top: 8px; }
.import-out .callout { margin: 6px 0; }

/* gráfico */
.evo .chart { display: block; width: 100%; height: auto; max-height: 250px; background: rgba(255, 255, 255, .45); border: 2px solid var(--parch-edge); border-radius: 12px; }
.evo-table { margin-top: 8px; }
.evo-table summary { cursor: pointer; font-weight: 700; color: var(--ink-soft); }

/* relatório individual */
.report-actions { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 2px dashed rgba(120, 90, 30, .3); }
.report-title { margin: 0 0 2px; font-family: var(--font-display); font-size: 1.5rem; }
.report h3 { margin-top: 20px; }
.report .diary-entry { margin: 8px 0; }

/* caixas de marcar do painel (as perguntas dos estudantes usam .opt-mark) */
input.ck { -webkit-appearance: none; appearance: none; flex: none; width: 26px; height: 26px; margin: 0; border: 3px solid var(--parch-edge); border-radius: 50%; background: #fff; display: inline-grid; place-content: center; cursor: pointer; vertical-align: middle; }
input.ck[type=checkbox] { border-radius: 8px; }
input.ck:hover { border-color: var(--violet); }
input.ck:checked { border-color: var(--violet); background: var(--violet); }
input.ck[type=radio]:checked { box-shadow: inset 0 0 0 4px #fff; }
input.ck[type=checkbox]:checked::after { content: "✓"; color: #fff; font-weight: 900; font-size: 16px; line-height: 1; }
.hc input.ck { border-color: #000; }

/* editor de missões */
.modal.editor-modal { width: min(1060px, 100%); }
.editor .field input[type=text], .editor .field textarea { font-weight: 500; }
.editor-foot { position: sticky; bottom: -20px; margin: 18px -20px -20px; padding: 12px 20px; background: var(--parch); border-top: 2px dashed rgba(120, 90, 30, .4); z-index: 2; }
.lbl-line { margin: 10px 0 6px; font-size: .88rem; font-weight: 700; color: var(--ink-soft); }
.qe-list { display: grid; gap: 10px; margin: 8px 0 10px; }
.qe { border: 2px solid var(--parch-edge); border-radius: 14px; background: #fffdf5; }
.qe[open] { background: var(--parch-2); }
.qe-sum { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; cursor: pointer; list-style: none; font-weight: 800; }
.qe-sum::-webkit-details-marker { display: none; }
.qe-sum::before { content: "▸"; color: var(--violet); }
.qe[open] > .qe-sum::before { content: "▾"; }
.qe-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qe-tools { display: inline-flex; gap: 4px; flex: none; }
.qe-body { padding: 4px 14px 14px; }
.qe-opts { display: grid; gap: 8px; margin-bottom: 8px; }
.qe-opt { display: flex; align-items: flex-start; gap: 10px; }
.qe-opt > input.ck { margin-top: 9px; }
.qe-opt .order-n { margin-top: 6px; }
.qe-opt-main { flex: 1 1 auto; display: grid; gap: 4px; min-width: 0; }
.qe-fb { min-height: 36px !important; font-size: .88rem; }
.qe-opt .icon-btn { margin-top: 2px; }

/* avaliação do estudante */
.diag-item { padding: 10px 14px; border-radius: 14px; background: #fffdf5; border: 2px solid var(--parch-edge); border-left-width: 8px; }
.diag-item.ok { border-left-color: #2f9a6a; } .diag-item.no { border-left-color: #d8453d; }
.diag-q { margin: 8px 0 4px !important; font-weight: 800; }
.diag-exp { margin: 6px 0 0 !important; color: var(--ink-soft); }
details.diag-text > summary { cursor: pointer; }
details.diag-text:not([open]) > p { display: none; }

@media (max-width: 720px) {
  .teacher-scroll { max-height: none; }
  .tabs .tab { padding: 8px 10px; font-size: .88rem; }
  .qe-sum { flex-wrap: wrap; }
  .editor-foot { bottom: -14px; margin: 14px -14px -16px; padding: 10px 14px; }
}

/* impressão: só o relatório */
#print-root { display: none; }
@media print {
  html.printing, html.printing body { overflow: visible !important; height: auto !important; background: #fff !important; color: #000 !important; }
  html.printing body > *:not(#print-root) { display: none !important; }
  html.printing #print-root { display: block !important; padding: 0; font-size: 11pt; color: #000; }
  #print-root * { color: #000 !important; background: transparent !important; box-shadow: none !important; text-shadow: none !important; }
  #print-root .tbl-wrap { max-height: none !important; overflow: visible !important; border: 1px solid #666 !important; }
  #print-root table.tbl th { position: static !important; background: #eee !important; }
  #print-root table.tbl th, #print-root table.tbl td { border-bottom: 1px solid #999; }
  #print-root .kpis { display: grid; grid-template-columns: repeat(3, 1fr); }
  #print-root .kpi { border: 1px solid #666; }
  #print-root .meter { border: 1px solid #666; } #print-root .meter > i { background: #444 !important; }
  #print-root .callout, #print-root .empty { border: 1px solid #888; }
  #print-root h2, #print-root h3 { break-after: avoid; } #print-root tr, #print-root article { break-inside: avoid; }
  #print-root button, #print-root .report-actions { display: none !important; }
  #print-root .linkbtn { text-decoration: none; }
  #print-root svg.chart { max-height: 220px; }
}
</style>

<body>
<div id="app" class="app">
  <div id="stage"><canvas id="game" tabindex="-1" aria-label="Mapa do jogo"></canvas></div>

  <div id="hud" class="hud" hidden>
    <div class="hud-left">
      <button class="hud-avatar" id="hud-avatar" type="button" aria-label="Abrir o menu do explorador"><canvas id="hud-portrait" width="44" height="44"></canvas></button>
      <div class="hud-info">
        <div class="hud-name" id="hud-name"></div>
        <div class="hud-level" id="hud-level"></div>
        <div class="xpbar" id="hud-xpbar" role="progressbar" aria-label="Experiência" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="hud-xp"></i></div>
        <div class="hud-xp-text" id="hud-xp-text"></div>
      </div>
    </div>
    <div class="hud-right">
      <div class="hud-chips">
        <div class="chip" id="hud-coins" title="Moedas"></div>
        <div class="chip hearts" id="hud-hearts" title="Corações da missão" hidden></div>
      </div>
      <div class="hud-buttons">
        <button class="icon-btn" id="btn-notebook" type="button" aria-label="Caderno de pistas" title="Caderno de pistas"></button>
        <button class="icon-btn" id="btn-menu" type="button" aria-label="Menu (Esc)" title="Menu (Esc)"></button>
      </div>
    </div>
    <div class="hud-save" id="hud-save" role="status" aria-live="polite"></div>
    <div class="hud-zone" id="hud-zone" aria-live="polite"></div>
    <div class="hud-goal" id="hud-goal" hidden></div>
  </div>

  <div id="prompt" class="prompt" hidden><kbd id="prompt-key">E</kbd><span id="prompt-text"></span></div>
  <div id="dialog-root"></div>
  <div id="touch-root"></div>
  <div id="ui-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="boot" class="boot" role="status"><div class="boot-card"><div class="boot-title">Liga dos Leitores</div><div class="boot-sub" id="boot-msg">Preparando o mundo…</div><div class="boot-bar"><i></i></div></div></div>
  <noscript><div class="boot"><div class="boot-card"><div class="boot-title">Liga dos Leitores</div><p>Este jogo precisa de JavaScript ativado no navegador.</p></div></div></noscript>
</div>
